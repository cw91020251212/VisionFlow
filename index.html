<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisionFlow | 專業網頁視覺設計</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --panel-soft: #f7f8fa;
      --text: #17202a;
      --muted: #697586;
      --line: #d9dee7;
      --accent: #356df3;
      --accent-soft: #eaf0ff;
      --danger: #c0392b;
      --sidebar-width: 170px;
      --inspector-width: 260px; /* 加闊少少容納更多設定 */
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; color-scheme: light; }
    body { margin: 0; overflow: hidden; color: var(--text); background: var(--bg); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(53, 109, 243, .25); outline-offset: 2px; }
    
    .app { width: 100%; height: 100dvh; display: grid; grid-template-rows: 44px minmax(0, 1fr) 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 40; position: relative; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
    .brand-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: #fff; background: var(--accent); box-shadow: 0 4px 10px rgba(53, 109, 243, .28); }
    .top-actions, .toolbar-group, .ai-actions { display: flex; align-items: center; gap: 5px; }
    
    .button { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--text); background: var(--panel); font-size: 11px; }
    .button:hover { background: var(--panel-soft); }
    .button:active { color: var(--text); background: var(--panel-soft); }
    .button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
    .button.primary:hover { filter: brightness(.95); }
    .button.danger { color: var(--danger); }
    
    .workspace { position: relative; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--inspector-width); min-width: 0; min-height: 0; overflow: hidden; transition: grid-template-columns .16s ease; }
    .workspace.resizing { transition: none !important; }
    .sidebar, .inspector { position: relative; z-index: 30; width: auto; height: 100%; min-width: 0; min-height: 0; padding: 8px; overflow: auto; background: var(--panel); box-shadow: 0 12px 30px rgba(23, 32, 42, .14); transition: transform .16s ease, opacity .16s ease; font-size: 11px; container-type: inline-size; }
    .sidebar { border-right: 1px solid var(--line); }
    .inspector { border-left: 1px solid var(--line); }
    .workspace.left-closed { grid-template-columns: 0 minmax(0, 1fr) var(--inspector-width); }
    .workspace.right-closed { grid-template-columns: var(--sidebar-width) minmax(0, 1fr) 0; }
    .workspace.left-closed.right-closed { grid-template-columns: 0 minmax(0, 1fr) 0; }
    .workspace.left-closed .sidebar { transform: translateX(-105%); opacity: 0; pointer-events: none; overflow: hidden; }
    .workspace.right-closed .inspector { transform: translateX(105%); opacity: 0; pointer-events: none; overflow: hidden; }
    
    .app.focus-mode { grid-template-rows: minmax(0, 1fr); } 
    .app.focus-mode .topbar, .app.focus-mode .footer { display: none !important; }
    #focus-exit { display: none; }
    .app.focus-mode #focus-exit { display: inline-flex; }
    
    .canvas-area { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #e4e8ee; position: relative; }
    .canvas-toolbar { position: relative; z-index: 11; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; height: 38px; border-bottom: 1px solid #cfd6e0; background: rgba(255,255,255,.88); overflow-x: auto; white-space: nowrap; flex-shrink: 0; }
    .toolbar-label { color: var(--muted); font-size: 11px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .zoom { min-width: 48px; text-align: center; color: var(--muted); font-size: 11px; }
    
    .workspace-main { display: flex; flex-direction: column; flex: 1; min-height: 0; background: #e4e8ee; position: relative; }
    .ruler-h-container { height: 18px; display: flex; background: #fff; z-index: 10; border-bottom: 1px solid #cfd6e0; }
    .ruler-corner { width: 18px; background: #f4f5f7; border-right: 1px solid #cfd6e0; flex-shrink: 0; display: grid; place-items: center; font-size: 8px; color: #a0abbc; user-select: none; }
    .ruler-h { flex: 1; height: 18px; cursor: crosshair; }
    .workspace-body { display: flex; flex: 1; min-height: 0; position: relative; }
    .ruler-v { width: 18px; height: 100%; border-right: 1px solid #cfd6e0; background: #fff; cursor: crosshair; z-index: 10; }
    
    .canvas-scroll { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 14px; overscroll-behavior: contain; position: relative; }
    .artboard-wrap { position: relative; min-width: 1px; min-height: 1px; margin: 0 auto; transition: width 0.2s, height 0.2s; }
    .artboard { position: relative; transform-origin: top left; border: 1px solid #c4ccd8; background: #fff; box-shadow: 0 18px 45px rgba(33, 45, 65, .16); transition: width 0.2s, height 0.2s; }
    .artboard.imported-board { min-width: 1px; min-height: 1px; overflow: hidden; border-radius: 4px; }
    .imported-frame { display: block; width: 100%; height: 100%; min-width: 1px; min-height: 1px; border: 0; background: #fff; }
    .imported-frame.editing-frame { cursor: crosshair; }
    
    .panel-head { position: sticky; top: -8px; z-index: 5; display: flex; align-items: center; gap: 6px; margin: -8px -8px 8px; padding: 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .panel-head > span { flex: 1; min-width: 0; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-close { flex-shrink: 0; display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: var(--panel); font-size: 11px; line-height: 1; }
    .panel-close:hover { color: var(--danger); border-color: var(--danger); background: var(--panel-soft); }

    .section { padding: 0 0 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; }
    .panel-title { margin: 0 0 6px; font-size: 11px; font-weight: 700; color: #17202a; letter-spacing: .02em; display: flex; align-items: center; gap: 4px; }
    .panel-title::before { content: ""; display: block; width: 3px; height: 10px; background: var(--accent); border-radius: 2px; }
    .sidebar .section, .inspector .section { margin-bottom: 12px; padding-bottom: 10px; }
    .hint, .empty { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .file-drop { padding: 6px; border: 1px dashed #b7c0cf; border-radius: 7px; color: var(--muted); background: var(--panel-soft); line-height: 1.3; }
    .file-drop strong { display: block; margin-bottom: 4px; color: var(--text); }
    .file-drop input { width: 100%; margin-top: 8px; font-size: 11px; }
    .file-drop .folder-label { display: block; margin-top: 8px; text-align: center; cursor: pointer; }
    .file-drop .folder-label input { display: none; }
    .file-drop small { display: block; margin-top: 6px; font-size: 10px; line-height: 1.35; }
    
    .layer-list { display: grid; gap: 2px; }
    .layer { display: flex; align-items: center; gap: 4px; width: 100%; padding: 4px 5px; text-align: left; color: var(--text); border: 1px solid transparent; border-radius: 5px; background: transparent; font-size: 11px; overflow: hidden; }
    .layer:hover { background: var(--panel-soft); }
    .layer.selected { border-color: #b7c9ff; background: var(--accent-soft); }
    .layer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-icon { width: 16px; flex-shrink: 0; color: var(--muted); text-align: center; font-size: 10px; }
    
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .theme-card { min-height: 40px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; text-align: left; color: var(--theme-text); background: var(--theme-bg); }
    .theme-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .theme-swatch { display: flex; gap: 2px; margin-bottom: 3px; }
    .theme-swatch i { display: block; width: 14px; height: 6px; border-radius: 3px; background: var(--swatch); }
    .theme-card span { font-size: 9px; font-weight: 700; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .align-tools { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .align-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .align-grid .button { min-width: 0; padding: 4px 0; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
    .align-grid .button:nth-child(7), .align-grid .button:nth-child(8) { grid-column: span 3; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    
    .field { display: flex; flex-direction: column; gap: 2px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 10px; margin: 0; }
    .field input[type="text"], .field input[type="number"], .field textarea, .field select { width: 100%; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--text); background: var(--panel); font-size: 11px; }
    .checkbox-field { display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 4px; cursor: pointer; font-weight: bold; }
    .color-input { display: flex; gap: 4px; align-items: center; }
    .color-input input[type=color] { width: 26px; padding: 1px; height: 23px; cursor: pointer; border: 1px solid var(--line); border-radius: 3px; }

    .ai-box { padding: 6px; border: 1px solid #bfd0ff; border-radius: 7px; background: #f4f7ff; }
    .ai-box p { margin: 0 0 6px; color: #40537d; font-size: 11px; line-height: 1.4; }
    .ai-box textarea { width: 100%; min-height: 48px; padding: 5px; border: 1px solid #c9d5f4; border-radius: 5px; resize: vertical; font-size: 11px; }
    .ai-actions { margin-top: 6px; }
    .ai-actions .button { flex: 1; padding: 5px 6px; }
    .summary { margin-top: 8px; padding: 7px; border-radius: 6px; color: #40537d; background: #e8efff; font-size: 10px; line-height: 1.5; }
    
    .status { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-top: 1px solid #cfd6e0; color: var(--muted); font-size: 11px; background: rgba(255,255,255,.88); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #2eae67; }
    .footer { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); font-size: 10px; z-index: 10; position: relative; }
    kbd { padding: 2px 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-soft); font-size: 9px; }
    
    .eraser-icon { display: inline-block; width: 14px; height: 10px; margin-right: 2px; border: 1px solid currentColor; border-radius: 2px; background: linear-gradient(135deg, transparent 0 38%, currentColor 39% 47%, transparent 48%), linear-gradient(135deg, #ffd9df 0 48%, #fff 49% 100%); transform: rotate(-42deg); vertical-align: -1px; }
    .eraser-icon.active { background: linear-gradient(135deg, transparent 0 38%, currentColor 39% 47%, transparent 48%), linear-gradient(135deg, #ff9eb0 0 48%, #fff 49% 100%); box-shadow: 0 0 0 2px rgba(230,64,92,.16); }
    .app.eraser-mode .workspace-main, .app.eraser-mode .workspace-main * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23ffffff" stroke="%23e6405c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>') 0 24, crosshair !important; }
    .app.eraser-mode .demo-item { pointer-events: none !important; }
    .app.eraser-mode .resize-handle { display: none !important; }

    .guide-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: visible; }
    .guide-line { position: absolute; background: transparent; pointer-events: none; }
    /* 無限長度設定 */
    .guide-line.vertical { top: -10000px; bottom: -10000px; width: 1px; transform: none; border-left: 1px dashed rgba(230, 64, 92, .78); }
    .guide-line.horizontal { left: -10000px; right: -10000px; height: 1px; transform: none; border-top: 1px dashed rgba(230, 64, 92, .78); }
    .guide-line.manual-guide { pointer-events: auto; background: transparent; }
    .guide-line.manual-guide.vertical { width: 1px; border-left: 1px dashed rgba(230, 64, 92, .72); cursor: ew-resize; }
    .guide-line.manual-guide.horizontal { height: 1px; border-top: 1px dashed rgba(230, 64, 92, .72); cursor: ns-resize; }
    .guide-line::after { content: ""; position: absolute; z-index: 1; }
    .guide-line.vertical::after { top: 0; bottom: 0; left: -15px; width: 31px; cursor: inherit; }
    .guide-line.horizontal::after { left: 0; right: 0; top: -15px; height: 31px; cursor: inherit; }
    .guide-line.manual-guide.selected-manual-guide { border-color: #356df3; }
    .guide-line.selected-guide-line { border-color: #356df3 !important; }
    
    .guide-line.snap.vertical { width: 1px; border-left: 1px dashed #ff6b35; box-shadow: 0 0 0 1px rgba(255, 107, 53, .08); }
    .guide-line.snap.horizontal { height: 1px; border-top: 1px dashed #ff6b35; box-shadow: 0 0 0 1px rgba(255, 107, 53, .08); }
    .guide-line.snap-point { width: 12px; height: 12px; border: none; border-radius: 50%; background: #e6405c; transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(230, 64, 92, .25); pointer-events: none; z-index: 50; }
    
    .demo-item { position: absolute; user-select: none; box-sizing: border-box; }
    .demo-item.editable { cursor: move; outline: none; outline-offset: -2px; touch-action: none; }
    .demo-item.selected { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: none; }
    .guide-copying { border-color: #17a673 !important; cursor: grabbing !important; }
    .guide-copy-ready { border-color: #17a673 !important; cursor: grab !important; }
    
    .resizer { position: absolute; top: 0; bottom: 0; width: 14px; z-index: 40; cursor: ew-resize; background: transparent; touch-action: none; }
    .resizer-left { left: -7px; }
    .resizer-right { right: -7px; }
    .resizer::after { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background 0.2s; }
    .resizer:hover::after, .resizer.active::after { background: var(--accent); }
    .workspace.left-closed .resizer-left, .workspace.right-closed .resizer-right { pointer-events: none; opacity: 0; }
    
    .resize-handle { position: absolute; z-index: 100; width: 10px; height: 10px; padding: 0; border: 0; border-radius: 3px; background: var(--accent); box-shadow: 0 0 0 1.5px #fff; touch-action: none; }
    .resize-handle.n { top: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
    .resize-handle.s { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
    .resize-handle.e { top: 50%; right: -5px; transform: translateY(-50%); cursor: ew-resize; }
    .resize-handle.w { top: 50%; left: -5px; transform: translateY(-50%); cursor: ew-resize; }
    .resize-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
    .resize-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .resize-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .resize-handle.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
    .resize-handle.c { top: 50%; left: 50%; transform: translate(-50%, -50%); cursor: move; }
    
    .hero { padding: 28px 30px; }
    .hero h1 { margin: 0 0 10px; font-size: 31px; line-height: 1; }
    .hero p { margin: 0; color: var(--hero-muted, #dce6ff); font-size: 14px; line-height: 1.5; }
    .eyebrow { margin: 0 0 8px; color: #a9c0ff; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .card { padding: 20px; }
    .card .icon { display: grid; place-items: center; width: 34px; height: 34px; margin-bottom: 13px; border-radius: 10px; color: #fff; }
    .card h3 { margin: 0 0 7px; font-size: 15px; }
    .card p { margin: 0; color: var(--card-muted, #697586); font-size: 12px; line-height: 1.5; }
    .cta { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 18px; }
    .cta span { font-size: 13px; font-weight: 650; }
    .cta button { padding: 8px 13px; border: 0; border-radius: 8px; color: #17202a; background: #fff; font-weight: 750; pointer-events: none; }
    
    @media (max-width: 700px) { 
      body { overflow: hidden; } 
      .app { grid-template-rows: 44px minmax(0, 1fr) auto; } 
      .workspace, .workspace.left-closed, .workspace.right-closed, .workspace.left-closed.right-closed { display: block; } 
      .canvas-area { position: absolute; inset: 0; width: 100%; height: 100%; } 
      .sidebar, .inspector { position: absolute; top: 0; bottom: 0; z-index: 30; width: min(var(--sidebar-width), 88vw); } 
      .sidebar { left: 0; } 
      .inspector { right: 0; } 
      .workspace:not(.left-closed) .sidebar, .workspace:not(.right-closed) .inspector { transform: translateX(0); opacity: 1; pointer-events: auto; } 
      .resizer { display: none; } 
      .canvas-toolbar { align-items: stretch; flex-wrap: wrap; padding: 4px; } 
      .canvas-toolbar > .toolbar-group:first-child { min-width: 0; width: 100%; overflow-x: auto; scrollbar-width: none; } 
      .canvas-toolbar > .toolbar-group:last-child { margin-left: auto; } 
      .toolbar-label { max-width: 120px; } 
      .top-actions { min-width: 0; gap: 3px; overflow-x: auto; scrollbar-width: none; } 
      .top-actions .button { flex: 0 0 auto; padding: 4px 6px; } 
    }
  
    .selection-marquee {
      position: absolute;
      border: 1.5px solid var(--accent);
      background: rgba(53, 109, 243, 0.15);
      pointer-events: none;
      z-index: 10000;
      display: none;
    }
    .deep-inspect-list {
      margin-top: 10px;
      padding: 8px;
      background: var(--accent-soft);
      border-radius: 6px;
      border: 1px solid var(--accent);
    }
    .deep-inspect-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      cursor: pointer;
      font-size: 11px;
      border-radius: 4px;
    }
    .deep-inspect-item:hover { background: rgba(53, 109, 243, 0.1); }
    .deep-inspect-item.active { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"><img src="icon.png" alt="V" style="width: 100%; height: 100%; border-radius: 4px; object-fit: cover;" onerror="this.style.display='none'"></div><span>VisionFlow</span></div>
      <div class="top-actions">
        <button class="button" id="undo">↶ 復原</button>
        <button class="button" id="redo">↷ 重做</button>
        <button class="button" id="reset">清空畫布</button>
        <button class="button" id="focus-mode">⛶ 全畫面</button>
        <button class="button primary" id="export">匯出 HTML</button>
      </div>
    </header>
    
    <main class="workspace left-closed right-closed">
      <aside class="sidebar" id="project-sidebar">
        <div class="panel-head"><button class="panel-close" id="close-left" title="關閉圖層面板" aria-label="關閉圖層面板">✕</button><span>圖層 / 專案</span></div>
        <section class="section">
          <h2 class="panel-title">專案</h2>
          <div class="file-drop">
            <strong>匯入 HTML</strong>
            <input id="file-input" type="file" accept=".html,.htm,text/html" multiple>
            <label class="button folder-label">選取整個網站資料夾<input id="folder-input" type="file" webkitdirectory directory multiple></label>
          </div>
        </section>
        <section class="section">
          <h2 class="panel-title">圖層</h2>
          <div class="layer-list" id="layers"></div>
        </section>
        <section class="section">
          <h2 class="panel-title">風格配置</h2>
          <div class="theme-grid" id="themes"></div>
        </section>
      </aside>
      
      <section class="canvas-area">
        <div class="resizer resizer-left" id="sidebar-resizer" title="拖曳調整左欄闊度"></div>
        <div class="resizer resizer-right" id="inspector-resizer" title="拖曳調整右欄闊度"></div>
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button class="button" id="toggle-left">☰ 圖層</button>
            <button class="button" id="toggle-right">⚙ 設定</button>
            <button class="button" id="edit-mode">✎ 編輯</button>
            <button class="button" id="toggle-viewport">📱 手機</button><button class="button primary" id="export-project">💾 導出</button>
            <button class="button" id="share-project">🔗 分享</button>
            <button class="button" id="toggle-guides">⌗ 參考線：關</button>
            <button class="button" id="guide-eraser"><span class="eraser-icon"></span><span id="eraser-label">擦膠</span></button>
            <button class="button" id="add-vertical-guide">＋ 垂直</button>
            <button class="button" id="add-horizontal-guide">＋ 水平</button>
            <button class="button" id="fit-view">適合畫布</button>

      const match = colorStr.match(/\d+/g);

    function getSnapTargets(skipIds = []) {
      const targets = { v: new Set(), h: new Set() };
      
      // 5px / 50px 尺規吸附網格
      let gridStep = 5;
      if (zoom > 1.5) gridStep = 2.5;
      if (zoom < 0.5) gridStep = 10;
      const maxW = importedMode ? importedViewport.width : (viewportMode === 'mobile' ? 375 : 760);
      const maxH = importedMode ? importedViewport.height : (viewportMode === 'mobile' ? 812 : 510);
      for(let i = -2000; i <= maxW + 2000; i += gridStep) targets.v.add(i);
      for(let i = -2000; i <= maxH + 2000; i += gridStep) targets.h.add(i);

      if (!importedMode) {
        manualGuides.forEach(g => { if (g.kind === 'vertical') targets.v.add(g.position); else targets.h.add(g.position); });
        items.forEach(item => {
          if (skipIds.includes(item.id)) return;
          targets.v.add(item.x); targets.v.add(item.x + item.w / 2); targets.v.add(item.x + item.w);
          targets.h.add(item.y); targets.h.add(item.y + item.h / 2); targets.h.add(item.y + item.h);
        });
      } else {
        importedManualGuides.forEach(g => { if (g.kind === 'vertical') targets.v.add(g.position); else targets.h.add(g.position); });
      }
      return { v: Array.from(targets.v).sort((a,b)=>a-b), h: Array.from(targets.h).sort((a,b)=>a-b) };
    }

    function findBestSnap(values, targets, threshold = 5) {
      let bestDiff = threshold + 0.1; let snapOffset = 0; let snappedTarget = null;
      for (const val of values) {
        for (const t of targets) {
          const diff = Math.abs(val - t);
          if (diff < bestDiff) { bestDiff = diff; snapOffset = t - val; snappedTarget = t; }
        }
      }
      return { snapped: bestDiff <= threshold, offset: snapOffset, target: snappedTarget };
    }

    function drawRulers() {
      const rulerH = document.getElementById('ruler-h'); const rulerV = document.getElementById('ruler-v');
      const scroll = document.querySelector('.canvas-scroll');
      if (!rulerH || !rulerV || !scroll || !artboard) return;
      const dpr = window.devicePixelRatio || 1;
      const rectH = rulerH.getBoundingClientRect(); const rectV = rulerV.getBoundingClientRect();
      if (rectH.width === 0 || rectV.height === 0) return;
      rulerH.width = rectH.width * dpr; rulerH.height = rectH.height * dpr;
      rulerV.width = rectV.width * dpr; rulerV.height = rectV.height * dpr;
      const ctxH = rulerH.getContext('2d'); const ctxV = rulerV.getContext('2d');
      ctxH.scale(dpr, dpr); ctxV.scale(dpr, dpr);
      const scrollRect = scroll.getBoundingClientRect(); const artboardRect = artboard.getBoundingClientRect();
      const originX = artboardRect.left - scrollRect.left; const originY = artboardRect.top - scrollRect.top;
      
      let logicalStep = 50; let minorStep = 5;
      if (zoom > 1.5) { logicalStep = 25; minorStep = 2.5; }
      if (zoom < 0.5) { logicalStep = 100; minorStep = 10; }
      
      ctxH.fillStyle = '#697586'; ctxH.strokeStyle = '#b7c0cf'; ctxH.font = '9px Inter, sans-serif';
      ctxH.beginPath();
      let startLogicalX = Math.floor(-originX / zoom / minorStep) * minorStep;
      for (let logicalX = startLogicalX; (logicalX * zoom + originX) < rectH.width; logicalX += minorStep) {
        const x = Math.round(logicalX * zoom + originX); if (x < 0) continue;
        const isMajor = Math.abs(logicalX % logicalStep) < 0.1;
        ctxH.moveTo(x, isMajor ? 0 : 10); ctxH.lineTo(x, 18);
        if (isMajor) ctxH.fillText(Math.round(logicalX), x + 4, 8);
      }
      ctxH.stroke();
      
      ctxV.fillStyle = '#697586'; ctxV.strokeStyle = '#b7c0cf'; ctxV.font = '9px Inter, sans-serif';
      ctxV.beginPath();
      let startLogicalY = Math.floor(-originY / zoom / minorStep) * minorStep;
      for (let logicalY = startLogicalY; (logicalY * zoom + originY) < rectV.height; logicalY += minorStep) {
        const y = Math.round(logicalY * zoom + originY); if (y < 0) continue;
        const isMajor = Math.abs(logicalY % logicalStep) < 0.1;
        ctxV.moveTo(isMajor ? 0 : 10, y); ctxV.lineTo(18, y);
        if (isMajor) { ctxV.save(); ctxV.translate(6, y + 4); ctxV.rotate(-Math.PI/2); ctxV.fillText(Math.round(logicalY), 0, 0); ctxV.restore(); }
      }
      ctxV.stroke();
    }

            let position = minY;
            ordered.forEach((r, index) => { if (index) r.state.dy += position - r.rect.top; position = (index ? position : r.rect.top) + r.rect.height + gap; });

    function startDemoDrag(event, forcedElement = null) {
      if (eraserMode || !editing || event.button !== 0) return;
      const target = forcedElement || event.target.closest('.demo-item');
      if (!target) return;
      event.preventDefault(); event.stopPropagation();
      const id = target.dataset.id;
      if (!selectedIds.includes(id)) {
          if (event.ctrlKey || event.metaKey) setDemoSelection([...selectedIds, id]);
          else setDemoSelection([id]);
      }
      
      // 修復：加入防護避免報錯
      if (target.setPointerCapture) { try { target.setPointerCapture(event.pointerId); } catch(e) {} }
      
      const startX = event.screenX; const startY = event.screenY;
      const initialStates = items.filter(it => selectedIds.includes(it.id)).map(it => ({ item: it, x: it.x, y: it.y }));
      let moved = false; let dragAxis = null;
      function move(moveEvent) {
        let dx = (moveEvent.screenX - startX) / zoom;
        let dy = (moveEvent.screenY - startY) / zoom;
        if (!moved && Math.max(Math.abs(dx), Math.abs(dy)) < 4) return;
        if (!moved) { savePoint(); moved = true; }
        
        if (moveEvent.shiftKey) {
            if (!dragAxis) dragAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            if (dragAxis === 'x') dy = 0; else dx = 0;
        } else {
            dragAxis = null;
        }
        
        const minX = Math.min(...initialStates.map(s => s.x + dx)); const maxX = Math.max(...initialStates.map(s => s.x + s.item.w + dx));
        const minY = Math.min(...initialStates.map(s => s.y + dy)); const maxY = Math.max(...initialStates.map(s => s.y + s.item.h + dy));
        const midX = minX + (maxX - minX) / 2; const midY = minY + (maxY - minY) / 2;
        
        const targets = getSnapTargets(selectedIds);
        const snapX = dragAxis === 'y' ? {snapped:false, offset:0} : findBestSnap([minX, midX, maxX], targets.v, 6 / zoom);
        const snapY = dragAxis === 'x' ? {snapped:false, offset:0} : findBestSnap([minY, midY, maxY], targets.h, 6 / zoom);
        
        const finalDx = dx + (snapX.snapped ? snapX.offset : 0);
        const finalDy = dy + (snapY.snapped ? snapY.offset : 0);
        
        initialStates.forEach(s => {
          s.item.x = Math.round(s.x + finalDx);
          s.item.y = Math.round(s.y + finalDy);
          const el = artboard.querySelector(`[data-id="${s.item.id}"]`);
          if (el) { el.style.left = `${s.item.x}px`; el.style.top = `${s.item.y}px`; }
        });
        drawSnapGuides(snapX.snapped ? [snapX.target] : [], snapY.snapped ? [snapY.target] : []);
      }
      function stop(upEvent) {
        if (target.releasePointerCapture) { try { target.releasePointerCapture(upEvent.pointerId); } catch(e) {} }
        target.removeEventListener('pointermove', move);
        target.removeEventListener('pointerup', stop);
        clearSnapGuides();
        if (moved) { window._justDragged = true; setTimeout(() => window._justDragged = false, 50); renderDemo(); }
      }
      target.addEventListener('pointermove', move);
      target.addEventListener('pointerup', stop);
    }
    
    function startDemoResize(event, item, direction) {
      if (eraserMode || !editing || event.button !== 0) return;
      event.preventDefault(); event.stopPropagation();
      const target = event.currentTarget;
      
      if (target.setPointerCapture) { try { target.setPointerCapture(event.pointerId); } catch(e) {} }
      
      const startX = event.screenX; const startY = event.screenY;
      const original = { x: item.x, y: item.y, w: item.w, h: item.h };
      let moved = false;
      function move(moveEvent) {
        const dx = (moveEvent.screenX - startX) / zoom;
        const dy = (moveEvent.screenY - startY) / zoom;
        if (!moved && Math.max(Math.abs(dx), Math.abs(dy)) < 4) return;
        if (!moved) { savePoint(); moved = true; }
        let nX = original.x, nY = original.y, nW = original.w, nH = original.h;
        
        if (direction.includes('e')) nW = original.w + dx;
        if (direction.includes('w')) { nW = original.w - dx; nX = original.x + dx; }
        if (direction.includes('s')) nH = original.h + dy;
        if (direction.includes('n')) { nH = original.h - dy; nY = original.y + dy; }
        
        const targets = getSnapTargets([item.id]);
        const checkX = []; if (direction.includes('e')) checkX.push(nX + nW); if (direction.includes('w')) checkX.push(nX);
        const checkY = []; if (direction.includes('s')) checkY.push(nY + nH); if (direction.includes('n')) checkY.push(nY);
        
        const snapX = findBestSnap(checkX, targets.v, 6 / zoom);
        const snapY = findBestSnap(checkY, targets.h, 6 / zoom);
        
        if (snapX.snapped) {
          if (direction.includes('e')) nW += snapX.offset;
          if (direction.includes('w')) { nX += snapX.offset; nW -= snapX.offset; }
        }
        if (snapY.snapped) {
          if (direction.includes('s')) nH += snapY.offset;
          if (direction.includes('n')) { nY += snapY.offset; nH -= snapY.offset; }
        }
        
        if (nW < 20) { if (direction.includes('w')) nX = original.x + original.w - 20; nW = 20; }
        if (nH < 20) { if (direction.includes('n')) nY = original.y + original.h - 20; nH = 20; }
        item.x = Math.round(nX); item.y = Math.round(nY);
        item.w = Math.round(nW); item.h = Math.round(nH);
        
        const el = artboard.querySelector(`[data-id="${item.id}"]`);
        if (el) Object.assign(el.style, {left:`${item.x}px`, top:`${item.y}px`, width:`${item.w}px`, height:`${item.h}px`});
        drawSnapGuides(snapX.snapped ? [snapX.target] : [], snapY.snapped ? [snapY.target] : []);
      }
      function stop(upEvent) {
        if (target.releasePointerCapture) { try { target.releasePointerCapture(upEvent.pointerId); } catch(e) {} }
        target.removeEventListener('pointermove', move);
        target.removeEventListener('pointerup', stop);
        clearSnapGuides();
        if (moved) renderDemo();
      }
      target.addEventListener('pointermove', move);
      target.addEventListener('pointerup', stop);
    }

      document.querySelector('#toggle-right').textContent = rightClosed ? '⚙ 設定' : '× 關設定';
    }
    document.querySelector('#toggle-left').addEventListener('click', () => setPanel('left', !document.querySelector('.workspace').classList.contains('left-closed')));
    document.querySelector('#toggle-right').addEventListener('click', () => setPanel('right', !document.querySelector('.workspace').classList.contains('right-closed')));
    document.querySelector('#close-left').addEventListener('click', () => setPanel('left', true));
    document.querySelector('#close-right').addEventListener('click', () => setPanel('right', true));
    
    document.querySelector('#edit-mode').addEventListener('click', event => { editing = !editing; event.currentTarget.textContent = editing ? '✓ 編輯中' : '✎ 編輯'; if (importedMode) renderImportedState(); else renderDemo(); });
    document.querySelector('#toggle-viewport').addEventListener('click', event => { viewportMode = viewportMode === 'desktop' ? 'mobile' : 'desktop'; event.currentTarget.textContent = viewportMode === 'mobile' ? '💻 電腦' : '📱 手機'; if (importedMode) updateImportedViewport(); else renderDemo(); fitView(); });
    document.querySelector('#undo').addEventListener('click', undo); document.querySelector('#redo').addEventListener('click', redo);
    document.querySelector('#reset').addEventListener('click', () => {
      savePoint();
      items = structuredClone(initialItems);
      importedMode = false; selectedId = null; selectedIds = []; editing = false; zoom = 1; zoomLabel.textContent = '100%';
      manualGuides = []; importedManualGuides = []; demoGuideTargets = []; importedGuideTargets = [];
      hiddenDemoGuideKeys = []; hiddenImportedGuideKeys = [];
      eraserMode = false; app.classList.remove('eraser-mode'); document.querySelector('#edit-mode').textContent = '✎ 編輯';
      viewportMode = 'desktop'; applyTheme(themes[0]); renderDemo();
    });
    document.querySelector('#zoom-in').addEventListener('click', () => { zoom = clamp(zoom + .1, .1, 1.5); zoomLabel.textContent = `${Math.round(zoom * 100)}%`; if (importedMode) updateImportedViewport(); else renderDemo(); drawRulers(); });
    document.querySelector('#zoom-out').addEventListener('click', () => { zoom = clamp(zoom - .1, .1, 1.5); zoomLabel.textContent = `${Math.round(zoom * 100)}%`; if (importedMode) updateImportedViewport(); else renderDemo(); drawRulers(); });
    
    document.querySelector('#toggle-guides').addEventListener('click', cycleGuideMode);
    document.querySelector('#guide-eraser').addEventListener('click', toggleGuideEraser);
    document.querySelector('#add-vertical-guide').addEventListener('click', () => addManualGuide('vertical'));
    document.querySelector('#add-horizontal-guide').addEventListener('click', () => addManualGuide('horizontal'));

    document.querySelector('#file-input').addEventListener('change', event => loadSelectedFiles([...event.target.files]));
    document.querySelector('#folder-input').addEventListener('change', event => loadSelectedFiles([...event.target.files]));
    
    document.querySelector('#ai-preview').addEventListener('click', () => { const input = document.querySelector('#ai-input').value.trim(); const summary = document.querySelector('#ai-summary'); if (!input) { summary.hidden = false; summary.textContent = '請輸入要求。'; return; } summary.hidden = false; summary.innerHTML = `<strong>意圖：</strong> ${escapeHtml(input)}<br><strong>目標：</strong> ${escapeHtml(importedSelected ? importedName(importedSelected) : selectedDemo()?.name || '未指定')}`; });
    document.querySelector('#voice').addEventListener('click', () => { const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SpeechRecognition) { alert('瀏覽器不支援語音輸入。'); return; } const recognition = new SpeechRecognition(); recognition.lang = 'zh-HK'; recognition.interimResults = false; recognition.onresult = event => { document.querySelector('#ai-input').value = event.results[0][0].transcript; }; recognition.start(); });

    document.querySelector('#focus-mode').addEventListener('click', toggleFullscreen); document.querySelector('#focus-exit').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => { const full = Boolean(document.fullscreenElement); app.classList.toggle('focus-mode', full); if (full) { const workspace = document.querySelector('.workspace'); workspace.classList.add('left-closed', 'right-closed'); syncPanelButtons(); } setTimeout(() => { if (typeof fitView === 'function') fitView(); drawRulers(); }, 50); });
    document.addEventListener('keydown', event => { const target = event.target; const typing = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable; if (typing) return; if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); event.shiftKey ? redo() : undo(); } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'y') { event.preventDefault(); redo(); } });
    
    function initResizers() {
      const workspace = document.querySelector('.workspace');
      document.querySelector('#sidebar-resizer').addEventListener('pointerdown', event => {
        if (event.button !== 0) return; event.preventDefault(); workspace.classList.add('resizing'); const startX = event.clientX; const startWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'));
        const move = e => document.documentElement.style.setProperty('--sidebar-width', `${clamp(startWidth + (e.clientX - startX), 90, window.innerWidth / 2)}px`);
        const stop = () => { workspace.classList.remove('resizing'); document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', stop); drawRulers(); };
        document.addEventListener('pointermove', move); document.addEventListener('pointerup', stop);
      });
      document.querySelector('#inspector-resizer').addEventListener('pointerdown', event => {
        if (event.button !== 0) return; event.preventDefault(); workspace.classList.add('resizing'); const startX = event.clientX; const startWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--inspector-width'));
        const move = e => document.documentElement.style.setProperty('--inspector-width', `${clamp(startWidth - (e.clientX - startX), 150, window.innerWidth / 2)}px`);
        const stop = () => { workspace.classList.remove('resizing'); document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', stop); drawRulers(); };
        document.addEventListener('pointermove', move); document.addEventListener('pointerup', stop);
      });
    }
    
    initResizers(); applyTheme(themes[0]); renderThemes(); renderDemo(); updateHistoryButtons(); drawRulers(); syncPanelButtons();
    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(registration => { console.log('Service Worker 已成功註冊:', registration); }).catch(error => { console.warn('Service Worker 註冊失敗:', error); });
    }
  </script>

<script id="universal-eraser-patch">
(function() {
  const patchStyle = document.createElement('style');
  patchStyle.id = 'universal-eraser-patch-style';
  patchStyle.textContent = `
    .guide-line::after, .ui-editor-guide::after { content: ""; position: absolute; z-index: 1; }
    .guide-line.vertical::after, .ui-editor-guide.vertical::after { top: -10000px; bottom: -10000px; left: -15px; width: 31px; cursor: inherit; }
    .guide-line.horizontal::after, .ui-editor-guide.horizontal::after { left: -10000px; right: -10000px; top: -15px; height: 31px; cursor: inherit; }
    .app.eraser-mode .canvas-area, .app.eraser-mode .canvas-area *, .eraser-mode, .eraser-mode * { cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSIjZmZmZmZmIiBzdHJva2U9IiNlNjQwNWMiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJtNyAyMS00LjMtNC4zYy0xLTEtMS0yLjUgMC0zLjRsOS42LTkuNmMxLTEgMi41LTEgMy40IDBsNS42IDUuNmMxIDEgMSAyLjUgMCAzLjRMMTMgMjEiLz48cGF0aCBkPSJNMjIgMjFINyIvPjxwYXRoIGQ9Im01IDExIDkgOSIvPjwvc3ZnPg==') 0 24, crosshair !important; }
  `;
  document.head.appendChild(patchStyle);

  let isDown = false;
  document.addEventListener('pointerdown', e => { if(e.button===0) isDown=true; }, true);
  document.addEventListener('pointerup', () => isDown=false, true);
  document.addEventListener('pointercancel', () => isDown=false, true);

  function isActive() {
    const btn = document.querySelector('#guide-eraser');
    return btn && (btn.classList.contains('primary') || btn.getAttribute('aria-pressed') === 'true');
  }

  document.addEventListener('pointerenter', e => {
    if(!isDown || !isActive()) return;
    const guide = e.target.closest('.guide-line') || e.target.closest('.ui-editor-guide');
    if(guide) guide.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true, cancelable:true, button:0, pointerId:e.pointerId||1}));
  }, true);

  setInterval(() => {
    const app = document.querySelector('.app');
    if(app) app.classList.toggle('eraser-mode', isActive());
    const iframe = document.querySelector('iframe.imported-frame, #imported-frame');
    if(iframe && iframe.contentDocument && iframe.contentDocument.documentElement) {
      const doc = iframe.contentDocument;
      if(!doc.getElementById('universal-eraser-patch-style')) doc.head.appendChild(patchStyle.cloneNode(true));
      if(!doc.__eraserPatchBound) {
        doc.addEventListener('pointerdown', e => { if(e.button===0) isDown=true; }, true);
        doc.addEventListener('pointerup', () => isDown=false, true);
        doc.addEventListener('pointercancel', () => isDown=false, true);
        doc.addEventListener('pointerenter', e => {
          if(!isDown || !isActive()) return;
          const guide = e.target.closest('.guide-line') || e.target.closest('.ui-editor-guide');
          if(guide) guide.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true, cancelable:true, button:0, pointerId:e.pointerId||1}));
        }, true);
        doc.__eraserPatchBound = true;
      }
      doc.documentElement.classList.toggle('eraser-mode', isActive());
    }
  }, 300);
})();
</script>
