<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisionFlow | 專業網頁視覺設計</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --panel-soft: #f7f8fa;
      --text: #17202a;
      --muted: #697586;
      --line: #d9dee7;
      --accent: #356df3;
      --accent-soft: #eaf0ff;
      --danger: #c0392b;
      --sidebar-width: 170px;
      --inspector-width: 260px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; color-scheme: light; }
    body { margin: 0; overflow: hidden; color: var(--text); background: var(--bg); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(53, 109, 243, .25); outline-offset: 2px; }
    
    .app { width: 100%; height: 100dvh; display: grid; grid-template-rows: 48px minmax(0, 1fr) 28px; }
    .main-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 40; position: relative; overflow-x: auto; scrollbar-width: none; }
    .main-toolbar::-webkit-scrollbar { display: none; }
    
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; margin-right: 6px; }
    .brand-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: #fff; background: var(--accent); box-shadow: 0 4px 10px rgba(53, 109, 243, .28); }
    .toolbar-group { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    
    .button { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--text); background: var(--panel); font-size: 11px; white-space: nowrap; }
    .button:hover { background: var(--panel-soft); }
    .button:active { color: var(--text); background: var(--panel-soft); }
    .button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
    .button.primary:hover { filter: brightness(.95); }
    
    .icon-btn { font-size: 15px; padding: 4px 8px; display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 28px; }
    .icon-btn.active-tool { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(53, 109, 243, 0.2); }
    .toolbar-divider { width: 1px; height: 16px; background: var(--line); margin: 0 4px; display: inline-block; }
    .zoom { min-width: 44px; text-align: center; color: var(--muted); font-size: 11px; font-weight: 600; }
    
    #shape-menu { display: none; position: fixed; z-index: 100000; background-color: var(--panel); min-width: 150px; box-shadow: 0px 12px 24px rgba(23, 32, 42, 0.15); border-radius: 8px; border: 1px solid var(--line); padding: 4px; }
    #shape-menu a { color: var(--text); padding: 8px 10px; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; border-radius: 4px; }
    #shape-menu a:hover { background-color: var(--accent-soft); color: var(--accent); }
    
    .sys-modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:24px; border-radius:12px; box-shadow:0 20px 40px rgba(0,0,0,0.25); z-index:999999; text-align:center; min-width:280px; border: 1px solid var(--line); }
    .sys-modal-text { margin-bottom:20px; font-size:14px; font-weight:600; color:var(--text); line-height: 1.5; white-space: pre-wrap; }
    .sys-modal-overlay { display:none; position:fixed; inset:0; background:rgba(23,32,42,0.4); z-index:999998; backdrop-filter: blur(2px); }

    .workspace { position: relative; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--inspector-width); min-width: 0; min-height: 0; overflow: hidden; transition: grid-template-columns .16s ease; }
    .workspace.resizing { transition: none !important; }
    .sidebar, .inspector { position: relative; z-index: 30; width: auto; height: 100%; min-width: 0; min-height: 0; padding: 8px; overflow: auto; background: var(--panel); box-shadow: 0 12px 30px rgba(23, 32, 42, .14); transition: transform .16s ease, opacity .16s ease; font-size: 11px; container-type: inline-size; }
    .sidebar { border-right: 1px solid var(--line); }
    .inspector { border-left: 1px solid var(--line); }
    .panel-close-btn { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border: none; background: transparent; color: var(--muted); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; z-index: 40; }
    .panel-close-btn:hover { background: var(--panel-soft); color: var(--text); }
    
    .workspace.left-closed { grid-template-columns: 0 minmax(0, 1fr) var(--inspector-width); }
    .workspace.right-closed { grid-template-columns: var(--sidebar-width) minmax(0, 1fr) 0; }
    .workspace.left-closed.right-closed { grid-template-columns: 0 minmax(0, 1fr) 0; }
    .workspace.left-closed .sidebar { transform: translateX(-105%); opacity: 0; pointer-events: none; overflow: hidden; }
    .workspace.right-closed .inspector { transform: translateX(105%); opacity: 0; pointer-events: none; overflow: hidden; }
    
    .app.focus-mode { grid-template-rows: 48px minmax(0, 1fr) 0px; } 
    .app.focus-mode .footer { display: none !important; }
    #focus-exit { display: none; }
    .app.focus-mode #focus-exit { display: inline-flex; }
    
    .canvas-area { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #e4e8ee; position: relative; }
    .workspace-main { display: flex; flex-direction: column; flex: 1; min-height: 0; background: #e4e8ee; position: relative; }
    .ruler-h-container { height: 18px; display: flex; background: #fff; z-index: 10; border-bottom: 1px solid #cfd6e0; }
    .ruler-corner { width: 18px; background: #f4f5f7; border-right: 1px solid #cfd6e0; flex-shrink: 0; display: grid; place-items: center; font-size: 8px; color: #a0abbc; user-select: none; }
    .ruler-h { flex: 1; height: 18px; cursor: crosshair; }
    .workspace-body { display: flex; flex: 1; min-height: 0; position: relative; }
    .ruler-v { width: 18px; height: 100%; border-right: 1px solid #cfd6e0; background: #fff; cursor: crosshair; z-index: 10; }
    
    .canvas-scroll { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 14px; overscroll-behavior: contain; position: relative; }
    .artboard-wrap { position: relative; min-width: 1px; min-height: 1px; margin: 0 auto; transition: width 0.2s, height 0.2s; }
    .artboard { position: relative; transform-origin: top left; outline: 1px solid #c4ccd8; border: none; background: #fff; box-shadow: 0 18px 45px rgba(33, 45, 65, .16); transition: width 0.2s, height 0.2s; overflow: visible !important; }
    .artboard.imported-board { min-width: 1px; min-height: 1px; overflow: visible !important; border-radius: 4px; }
    .imported-frame { display: block; width: 100%; height: 100%; min-width: 1px; min-height: 1px; border: 0; background: #fff; }
    .imported-frame.editing-frame { cursor: crosshair; }
    
    .section { padding: 0 0 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; }
    .panel-title { margin: 0 0 6px; font-size: 11px; font-weight: 700; color: #17202a; letter-spacing: .02em; display: flex; align-items: center; gap: 4px; }
    .panel-title::before { content: ""; display: block; width: 3px; height: 10px; background: var(--accent); border-radius: 2px; }
    .sidebar .section, .inspector .section { margin-bottom: 12px; padding-bottom: 10px; }
    .hint, .empty { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .file-drop { padding: 6px; border: 1px dashed #b7c0cf; border-radius: 7px; color: var(--muted); background: var(--panel-soft); line-height: 1.3; }
    .file-drop strong { display: block; margin-bottom: 4px; color: var(--text); }
    .file-drop input { width: 100%; margin-top: 8px; font-size: 11px; }
    .file-drop .folder-label { display: block; margin-top: 8px; text-align: center; cursor: pointer; }
    .file-drop .folder-label input { display: none; }
    
    .layer-list { display: grid; gap: 2px; }
    .layer { display: flex; align-items: center; gap: 4px; width: 100%; padding: 4px 5px; text-align: left; color: var(--text); border: 1px solid transparent; border-radius: 5px; background: transparent; font-size: 11px; overflow: hidden; }
    .layer:hover { background: var(--panel-soft); }
    .layer.selected { border-color: #b7c9ff; background: var(--accent-soft); }
    .layer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-icon { width: 16px; flex-shrink: 0; color: var(--muted); text-align: center; font-size: 10px; }
    
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .theme-card { min-height: 40px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; text-align: left; color: var(--theme-text); background: var(--theme-bg); }
    .theme-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .theme-swatch { display: flex; gap: 2px; margin-bottom: 3px; }
    .theme-swatch i { display: block; width: 14px; height: 6px; border-radius: 3px; background: var(--swatch); }
    .theme-card span { font-size: 9px; font-weight: 700; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .align-tools { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .align-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .align-grid .button { min-width: 0; padding: 4px 0; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
    .align-grid .button:nth-child(7), .align-grid .button:nth-child(8) { grid-column: span 3; }
    
    .field { display: flex; flex-direction: column; gap: 2px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 10px; margin: 0; }
    .field input[type="text"], .field input[type="number"], .field textarea, .field select { width: 100%; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--text); background: var(--panel); font-size: 11px; }
    .checkbox-field { display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 4px; cursor: pointer; font-weight: bold; }
    .color-input { display: flex; gap: 4px; align-items: center; }
    .color-input input[type=color] { width: 26px; padding: 1px; height: 23px; cursor: pointer; border: 1px solid var(--line); border-radius: 3px; }

    .status { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-top: 1px solid #cfd6e0; color: var(--muted); font-size: 11px; background: rgba(255,255,255,.88); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #2eae67; }
    .footer { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); font-size: 10px; z-index: 10; position: relative; }
    kbd { padding: 2px 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-soft); font-size: 9px; }
    
    .app.eraser-mode .workspace-main, .app.eraser-mode .workspace-main * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23ffffff" stroke="%23e6405c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>') 0 24, crosshair !important; }
    .app.eraser-mode .demo-item { pointer-events: none !important; }
    .app.eraser-mode .resize-handle { display: none !important; }
    
    .app.pan-mode .canvas-scroll, .app.pan-mode .canvas-scroll * { cursor: grab !important; }
    .app.panning .canvas-scroll, .app.panning .canvas-scroll * { cursor: grabbing !important; }
    
    .app.measure-mode .workspace-main, .app.measure-mode .workspace-main * { cursor: crosshair !important; }
    .app.measure-mode .demo-item { pointer-events: none !important; }
    .app.measure-mode .resize-handle { display: none !important; }

    .app.position-locked .demo-item.editable { cursor: default !important; }
    .app.position-locked .resize-handle.c { display: none !important; }

    .snap-marker { position: absolute; z-index: 2000000; pointer-events: none; transform: translate(-50%, -50%) scale(var(--snap-inv, 1)); transform-origin: center; }
    .snap-marker.type-intersection { width: 15px; height: 15px; }
    .snap-marker.type-intersection::before, .snap-marker.type-intersection::after { content: ""; position: absolute; left: 50%; top: 50%; width: 17px; height: 2.6px; background: #d017c8; border-radius: 1px; box-shadow: 0 0 0 1.4px rgba(255,255,255,.95); }
    .snap-marker.type-intersection::before { transform: translate(-50%,-50%) rotate(45deg); }
    .snap-marker.type-intersection::after  { transform: translate(-50%,-50%) rotate(-45deg); }
    .snap-marker.type-endpoint { width: 11px; height: 11px; background: #0fa958; box-shadow: 0 0 0 2px rgba(255,255,255,.95); border-radius: 1.5px; }
    .snap-marker.type-midpoint { width: 10px; height: 10px; background: #06b0d4; box-shadow: 0 0 0 2px rgba(255,255,255,.95); transform: translate(-50%, -50%) scale(var(--snap-inv, 1)) rotate(45deg); }
    .snap-marker.type-edge { width: 11px; height: 11px; border: 2.5px solid #e6405c; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
    .snap-marker.type-grid { width: 7px; height: 7px; background: #8792a6; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); opacity: .8; }
    .snap-tip { position: absolute; z-index: 2000001; pointer-events: none; white-space: nowrap; font-family: Inter, sans-serif; font-size: 10.5px; font-weight: 700; color: #fff; padding: 3px 7px; border-radius: 5px; background: rgba(23,32,42,.9); box-shadow: 0 2px 8px rgba(0,0,0,.25); transform: translate(12px, 10px) scale(var(--snap-inv, 1)); transform-origin: top left; }
    .snap-tip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .snap-infer-line { position: absolute; z-index: 1999998; pointer-events: none; }
    .snap-infer-line.vertical { width: 0; border-left: 1px dashed rgba(208,23,200,.85); }
    .snap-infer-line.horizontal { height: 0; border-top: 1px dashed rgba(208,23,200,.85); }
    .snap-align-line { position: absolute; z-index: 1999997; pointer-events: none; }
    .snap-align-line.vertical { width: 0; border-left: 1px solid #356df3; }
    .snap-align-line.horizontal { height: 0; border-top: 1px solid #356df3; }
    .global-snap-indicator { position: absolute; width: 14px; height: 14px; background: transparent; border: 2.5px solid #e6405c; border-radius: 50%; transform: translate(-50%, -50%); z-index: 999999; pointer-events: none; display: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8); }

    .measure-layer { position: absolute; inset: 0; pointer-events: none; z-index: 999998; }
    .measure-line { position: absolute; height: 1.5px; background: #e6405c; transform-origin: left center; box-shadow: 0 1px 3px rgba(255,255,255,0.5); pointer-events: none; }
    .measure-line::before, .measure-line::after { content: ""; position: absolute; width: 2px; height: 14px; background: #e6405c; top: -6.25px; box-shadow: 0 0 2px rgba(255,255,255,0.5); }
    .measure-line::before { left: 0; } .measure-line::after { right: 0; }
    .measure-label { position: absolute; background: #e6405c; color: #fff; padding: 4px 8px; border-radius: 6px; font-family: Inter, sans-serif; font-size: 13px; font-weight: 800; transform-origin: center; white-space: nowrap; box-shadow: 0 4px 10px rgba(230, 64, 92, 0.3); pointer-events: none; left: 50%; top: -24px; text-align: center; line-height: 1.3; border: 1px solid #fff; }

    .guide-layer { position: absolute; inset: 0 !important; z-index: 20; pointer-events: none; overflow: visible !important; width: 100% !important; height: 100% !important; }
    .guide-line { position: absolute; background: transparent; pointer-events: none; }
    .guide-line.vertical { top: -10000px !important; bottom: -10000px !important; height: auto !important; width: 1px; transform: none; border-left: 1px dashed rgba(230, 64, 92, .78); }
    .guide-line.horizontal { left: -10000px !important; right: -10000px !important; width: auto !important; height: 1px; transform: none; border-top: 1px dashed rgba(230, 64, 92, .78); }
    .guide-line.manual-guide { pointer-events: auto; background: transparent; }
    .guide-line.manual-guide.vertical { top: -10000px !important; bottom: -10000px !important; height: auto !important; width: 1px; border-left: 1px dashed rgba(230, 64, 92, .72); cursor: ew-resize; }
    .guide-line.manual-guide.horizontal { left: -10000px !important; right: -10000px !important; width: auto !important; height: 1px; border-top: 1px dashed rgba(230, 64, 92, .72); cursor: ns-resize; }
    .guide-line::after { content: ""; position: absolute; z-index: 1; }
    .guide-line.vertical::after { top: 0; bottom: 0; left: -15px; width: 31px; cursor: inherit; }
    .guide-line.horizontal::after { left: 0; right: 0; top: -15px; height: 31px; cursor: inherit; }
    .guide-line.manual-guide.selected-manual-guide { border-color: #356df3; }
    .guide-line.selected-guide-line { border-color: #356df3 !important; }
    
    .demo-item { position: absolute; user-select: none; box-sizing: border-box; }
    .demo-item.editable { cursor: move; outline: none; outline-offset: -2px; touch-action: none; }
    
    /* 普通選取 vs 群組選取 的清晰區別 */
    .demo-item.selected { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: none; z-index: 15; }
    .demo-item.selected.grouped-item { outline: 2.5px solid #d017c8 !important; outline-offset: -2.5px; z-index: 16; }
    
    .guide-copying { border-color: #17a673 !important; cursor: grabbing !important; }
    
    .resizer { position: absolute; top: 0; bottom: 0; width: 14px; z-index: 40; cursor: ew-resize; background: transparent; touch-action: none; }
    .resizer-left { left: -7px; } .resizer-right { right: -7px; }
    .resizer::after { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background 0.2s; }
    .resizer:hover::after, .resizer.active::after { background: var(--accent); }
    .workspace.left-closed .resizer-left, .workspace.right-closed .resizer-right { pointer-events: none; opacity: 0; }
    
    .resize-handle { position: absolute; z-index: 100; width: 10px; height: 10px; padding: 0; border: 0; border-radius: 3px; background: var(--accent); box-shadow: 0 0 0 1.5px #fff; touch-action: none; }
    .resize-handle.n { top: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
    .resize-handle.s { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
    .resize-handle.e { top: 50%; right: -5px; transform: translateY(-50%); cursor: ew-resize; }
    .resize-handle.w { top: 50%; left: -5px; transform: translateY(-50%); cursor: ew-resize; }
    .resize-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
    .resize-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .resize-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .resize-handle.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
    .resize-handle.c { top: 50%; left: 50%; transform: translate(-50%, -50%); cursor: move; }
    
    @media (max-width: 700px) { 
      body { overflow: hidden; } 
      .app { grid-template-rows: 48px minmax(0, 1fr) auto; } 
      .workspace, .workspace.left-closed, .workspace.right-closed, .workspace.left-closed.right-closed { display: block; } 
      .canvas-area { position: absolute; inset: 0; width: 100%; height: 100%; } 
      .sidebar, .inspector { position: absolute; top: 0; bottom: 0; z-index: 30; width: min(var(--sidebar-width), 88vw); } 
      .sidebar { left: 0; } .inspector { right: 0; } 
      .workspace:not(.left-closed) .sidebar, .workspace:not(.right-closed) .inspector { transform: translateX(0); opacity: 1; pointer-events: auto; } 
      .resizer { display: none; } 
    }
  
    .selection-marquee { position: absolute; border: 1.5px solid var(--accent); background: rgba(53, 109, 243, 0.15); pointer-events: none; z-index: 10000; display: none; }
    .deep-inspect-list { margin-top: 10px; padding: 8px; background: var(--accent-soft); border-radius: 6px; border: 1px solid var(--accent); }
    .deep-inspect-item { display: flex; align-items: center; gap: 6px; padding: 4px; cursor: pointer; font-size: 11px; border-radius: 4px; }
    .deep-inspect-item:hover { background: rgba(53, 109, 243, 0.1); }
    .deep-inspect-item.active { background: var(--accent); color: #fff; }

    .context-menu { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(23,32,42,0.2); z-index: 100000; padding: 4px; display: none; flex-direction: column; min-width: 140px; }
    .context-menu button { background: transparent; border: none; padding: 8px 12px; text-align: left; font-size: 12px; cursor: pointer; border-radius: 4px; color: var(--text); font-weight: 500; display: flex; gap: 8px; align-items: center; }
    .context-menu button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
    .context-menu button:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="app">
    <header class="main-toolbar">
      <div class="toolbar-group">
        <div class="brand"><div class="brand-mark"><img src="icon.png" alt="V" style="width: 100%; height: 100%; border-radius: 4px; object-fit: cover;" onerror="this.style.display='none'"></div><span>VisionFlow</span></div>
        <div class="toolbar-divider"></div>
        <button class="button icon-btn" id="toggle-left" title="顯示/隱藏 圖層面板">☰</button>

  <script>
    function rgbToHex(colorStr) {
      if (!colorStr || colorStr === 'transparent' || colorStr.includes('rgba(0, 0, 0, 0)')) return '#ffffff';
      if (colorStr.startsWith('#')) return colorStr.slice(0, 7);
      const match = colorStr.match(/\d+/g);
      if (!match || match.length < 3) return '#ffffff';
      return "#" + (1 << 24 | parseInt(match[0]) << 16 | parseInt(match[1]) << 8 | parseInt(match[2])).toString(16).slice(1);
    }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, Number.isFinite(value) ? value : min)); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]); }

    function sysAlert(text) {
       document.getElementById('sys-modal-text').innerText = text;
       document.getElementById('sys-modal').style.display = 'block';
       document.getElementById('sys-modal-overlay').style.display = 'block';
    }
    document.getElementById('sys-modal-btn').addEventListener('click', () => {
       document.getElementById('sys-modal').style.display = 'none';
       document.getElementById('sys-modal-overlay').style.display = 'none';
    });

    const initialItems = [];
    const availableFonts = ['Inter', 'Arial', 'Helvetica', 'Times New Roman', 'Georgia', 'Courier New', 'Verdana', 'Impact'];
    let items = structuredClone(initialItems);
    let history = []; let future = [];
    let selectedId = null; let selectedIds = [];
    let editing = false; let demoFieldDirty = false; let isTyping = false;
    let zoom = 1; let activeTheme = 'light'; let viewportMode = 'desktop';
    let isPositionLocked = false;
    
    let importedMode = false; let importedSourceHtml = ''; let importedHtml = '';
    let importedFrame = null; let importedSelected = null; let importedSelectedElements = [];
    let importedLayers = []; let isIframeLoaded = false;
    let importedViewport = { width: 1280, height: 720 };
    let importedDirty = false; let importedOverlay = null;
    // 匯入頁面的群組資料：WeakMap 不會污染最後匯出的 HTML。
    let importedGroupIds = new WeakMap(); let importedGroupSeq = 0;
    
    let guidesVisible = false; let guideMode = 'hidden'; let guideArmed = false;
    let eraserMode = false; let isErasing = false;
    let panMode = false; let isPanning = false; let panStart = { x: 0, y: 0, scrollLeft: 0, scrollTop: 0 };
    let measureMode = false; let measureState = 'idle'; let measureStart = {x:0, y:0}; let measureEnd = {x:0, y:0};
    let activeSnapHover = false;
    let snapDragActive = false;
    
    let manualGuides = []; let importedManualGuides = [];
    let importedGuideTargets = []; let demoGuideTargets = [];
    let guideDrag = null; let selectedManualGuide = null;
    let hiddenDemoGuideKeys = []; let hiddenImportedGuideKeys = [];
    let suppressImportedClick = false;
    
    const importedState = new WeakMap(); const importedElementIds = new WeakMap();
    
    const artboard = document.querySelector('#artboard'); const wrap = document.querySelector('.artboard-wrap');
    const layers = document.querySelector('#layers'); const themesEl = document.querySelector('#themes');
    const inspector = document.querySelector('#inspector-content');
    const statusText = document.querySelector('#status-text');
    const zoomLabel = document.querySelector('#zoom-label');
    const app = document.querySelector('.app');
    const canvasScroll = document.querySelector('#canvas-scroll');
    
    function setStatus(text) { statusText.textContent = text; }
    function selectedDemo() { return items.find(item => item.id === selectedId); }
    function selectedDemoItems() { return items.filter(item => selectedIds.includes(item.id)); }

    const measureLayer = document.createElement('div');
    measureLayer.className = 'measure-layer';
    measureLayer.innerHTML = '<div id="measure-indicator" class="global-snap-indicator"></div><div id="measure-line" class="measure-line" style="display:none"><div id="measure-label" class="measure-label"></div></div>';
    artboard.appendChild(measureLayer);

    const SNAP_CFG = { enabled: true, lineTol: 9, pointTol: 13, grid: true, gridSize: 10, markers: true };
    const SNAP_TIER = { endpoint: 100, intersection: 90, extension: 84, midpoint: 78, guide: 66, edge: 60, bound: 52, grid: 20 };
    const SNAP_STYLE = {
      endpoint: { cls:'type-endpoint', color:'#0fa958', label:'端點' }, intersection: { cls:'type-intersection', color:'#d017c8', label:'交點' },
      extension: { cls:'type-intersection', color:'#d017c8', label:'交點（延伸）' }, midpoint: { cls:'type-midpoint', color:'#06b0d4', label:'中點' },
      guide: { cls:'type-edge', color:'#e6405c', label:'參考線上' }, edge: { cls:'type-edge', color:'#e6405c', label:'邊線上' },
      bound: { cls:'type-edge', color:'#e6405c', label:'畫布邊' }, grid: { cls:'type-grid', color:'#8792a6', label:'網格' }
    };
    const INF = 100000;

    function collectSnapGeometry(skip = []) {
      const vLines = [], hLines = [], points = [];
      const seenP = new Set();
      
      const addV = (x, y1, y2, kind) => { if (Number.isFinite(x)) vLines.push({ x, y1: Math.min(y1,y2), y2: Math.max(y1,y2), kind }); };
      const addH = (y, x1, x2, kind) => { if (Number.isFinite(y)) hLines.push({ y, x1: Math.min(x1,x2), x2: Math.max(x1,x2), kind }); };
      const addPt = (x, y, kind) => { 
        if (!Number.isFinite(x) || !Number.isFinite(y)) return; 
        const key = `${Math.round(x*10)}_${Math.round(y*10)}_${kind}`; 
        if (seenP.has(key)) return; 
        seenP.add(key); 
        points.push({ x, y, kind, tier: SNAP_TIER[kind] }); 
      };
      
      const maxW = importedMode ? importedViewport.width : (viewportMode === 'mobile' ? 375 : 1280);
      const maxH = importedMode ? importedViewport.height : (viewportMode === 'mobile' ? 812 : 720);
      addV(0, 0, maxH, 'bound'); addV(maxW, 0, maxH, 'bound'); addH(0, 0, maxW, 'bound'); addH(maxH, 0, maxW, 'bound');
      
      const addRect = (x, y, w, h) => {
        if (!(w > 0) || !(h > 0)) return; const r = x + w, b = y + h, cx = x + w/2, cy = y + h/2;
        addV(x, y, b, 'edge'); addV(r, y, b, 'edge'); addH(y, x, r, 'edge'); addH(b, x, r, 'edge'); addV(cx, y, b, 'edge'); addH(cy, x, r, 'edge');
        addPt(x, y, 'endpoint'); addPt(r, y, 'endpoint'); addPt(x, b, 'endpoint'); addPt(r, b, 'endpoint'); addPt(cx, y, 'midpoint'); addPt(cx, b, 'midpoint'); addPt(x, cy, 'midpoint'); addPt(r, cy, 'midpoint'); addPt(cx, cy, 'midpoint');
      };
      
      if (!importedMode) {
        manualGuides.forEach(g => { if (g.kind === 'vertical') addV(g.position, -INF, INF, 'guide'); else addH(g.position, -INF, INF, 'guide'); });
        items.forEach(item => { if (!skip.includes(item.id)) addRect(item.x, item.y, item.w, item.h); });
      } else {
        importedManualGuides.forEach(g => { if (g.kind === 'vertical') addV(g.position, -INF, INF, 'guide'); else addH(g.position, -INF, INF, 'guide'); });
        if (importedFrame?.contentDocument) {
          const win = importedFrame.contentWindow;
          const sx = win ? win.scrollX : 0;
          const sy = win ? win.scrollY : 0;
          importedLayers.forEach(layer => {
            const el = layer.element; if (!el || !el.isConnected || skip.includes(el)) return;
            const r = el.getBoundingClientRect(); if (r.width <= 0 || r.height <= 0) return; 
            addRect(r.left + sx, r.top + sy, r.width, r.height);
          });
        }
      }

      const vLen = vLines.length; const hLen = hLines.length;
      for (let i = 0; i < vLen; i++) {
          for (let j = 0; j < hLen; j++) {
              const v = vLines[i]; const h = hLines[j];
              const onV = h.y >= v.y1 - 0.5 && h.y <= v.y2 + 0.5;
              const onH = v.x >= h.x1 - 0.5 && v.x <= h.x2 + 0.5;
              if (onV && onH) addPt(v.x, h.y, 'intersection');
          }
      }
      return { vLines, hLines, points };
    }

    let _snapGeoCache = null;
    function snapGeometry(skip = [], fresh = false) { if (fresh || !_snapGeoCache) _snapGeoCache = collectSnapGeometry(skip); return _snapGeoCache; }
    function invalidateSnapGeometry() { _snapGeoCache = null; }
    const nearestGrid = v => Math.round(v / SNAP_CFG.gridSize) * SNAP_CFG.gridSize;

    function resolveSnap(px, py, geo, opts = {}) {
      const minTier = opts.minTier ?? 0; const axis = opts.axis || null;
      const out = { x: px, y: py, snapped: false, kind: null, tier: 0, vLine: null, hLine: null, axes: '' };
      if (!SNAP_CFG.enabled) return out;
      
      const lineTol = SNAP_CFG.lineTol / zoom; 
      const pointTol = SNAP_CFG.pointTol / zoom;
      const searchTol = Math.max(lineTol, pointTol);
      
      let best = null; 
      const consider = c => { 
        if (axis === 'x' && !c.axes.includes('x')) return;
        if (axis === 'y' && !c.axes.includes('y')) return;
        if (c.tier < minTier) return; 
        if (!best || c.tier > best.tier || (c.tier === best.tier && c.dist < best.dist - 1e-9)) best = c; 
      };
      
      if (!axis) {
        for (const p of geo.points) {
          const dx = p.x - px, dy = p.y - py; if (Math.abs(dx) > pointTol || Math.abs(dy) > pointTol) continue;
          const d = Math.hypot(dx, dy); if (d <= pointTol) consider({ tier: p.tier, dist: d, x: p.x, y: p.y, kind: p.kind, axes: 'xy' });
        }
      }
      
      const nearV = axis === 'y' ? [] : geo.vLines.filter(l => Math.abs(l.x - px) <= searchTol);
      const nearH = axis === 'x' ? [] : geo.hLines.filter(l => Math.abs(l.y - py) <= searchTol);
      
      if (!axis) {
        for (const v of nearV) for (const h of nearH) {
          const dx = v.x - px, dy = h.y - py;
          if (Math.abs(dx) > pointTol || Math.abs(dy) > pointTol) continue;
          const d = Math.hypot(dx, dy);
          if (d > pointTol) continue;
          
          const onV = h.y >= v.y1 - 0.5 && h.y <= v.y2 + 0.5; 
          const onH = v.x >= h.x1 - 0.5 && v.x <= h.x2 + 0.5;
          const trueCross = onV && onH;
          consider({ tier: trueCross ? SNAP_TIER.intersection : SNAP_TIER.extension, dist: d, x: v.x, y: h.y, kind: trueCross ? 'intersection' : 'extension', vLine: v, hLine: h, axes: 'xy' });
        }
      }
      
      let bv = null, bh = null;
      for (const v of nearV) { 
          const d = Math.abs(v.x - px); 
          if (d > lineTol) continue; 
          if (!bv || v.kind === 'guide' && bv.kind !== 'guide' || d < bv.d - 1e-9 && (v.kind === bv.kind)) { 
              if (!bv || d < bv.d || SNAP_TIER[v.kind] > SNAP_TIER[bv.kind]) bv = { l: v, d }; 
          } 
      }
      for (const h of nearH) { 
          const d = Math.abs(h.y - py); 
          if (d > lineTol) continue; 
          if (!bh || d < bh.d || SNAP_TIER[h.kind] > SNAP_TIER[bh.kind]) bh = { l: h, d }; 
      }
      
      if (bv) consider({ tier: SNAP_TIER[bv.l.kind], dist: bv.d, x: bv.l.x, y: py, kind: bv.l.kind, vLine: bv.l, axes: 'x' });
      if (bh) consider({ tier: SNAP_TIER[bh.l.kind], dist: bh.d, x: px, y: bh.l.y, kind: bh.l.kind, hLine: bh.l, axes: 'y' });
      
      if (SNAP_CFG.grid) {
        const gx = nearestGrid(px), gy = nearestGrid(py); const dgx = Math.abs(gx - px), dgy = Math.abs(gy - py);
        const okX = axis !== 'y' && dgx <= lineTol, okY = axis !== 'x' && dgy <= lineTol;
        if (okX && okY) consider({ tier: SNAP_TIER.grid, dist: Math.hypot(dgx, dgy), x: gx, y: gy, kind: 'grid', axes: 'xy' });
        else if (okX) consider({ tier: SNAP_TIER.grid, dist: dgx, x: gx, y: py, kind: 'grid', axes: 'x' });
        else if (okY) consider({ tier: SNAP_TIER.grid, dist: dgy, x: px, y: gy, kind: 'grid', axes: 'y' });
      }
      
      if (!best) return out;
      if (best.axes === 'xy' && (best.kind === 'intersection' || best.kind === 'extension')) {
        for (const p of geo.points) { if (Math.abs(p.x - best.x) < 0.01 && Math.abs(p.y - best.y) < 0.01) { best = { ...best, kind: p.kind, tier: Math.max(best.tier, p.tier) }; break; } }
      }
      return { x: best.x, y: best.y, snapped: true, kind: best.kind, tier: best.tier, vLine: best.vLine || null, hLine: best.hLine || null, axes: best.axes, snappedX: best.axes.includes('x'), snappedY: best.axes.includes('y'), dist: best.dist };
    }

    function resolveBoxSnap(box, geo, opts = {}) {
      const axisLock = opts.axisLock || null; const handles = opts.handles || null;
      const res = { dx: 0, dy: 0, snapped: false, point: null, kind: null, vLines: [], hLines: [], infer: null };
      if (!SNAP_CFG.enabled) return res;
      const { minX, minY, maxX, maxY } = box; const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
      const pts = handles || [ { x: minX, y: minY }, { x: maxX, y: minY }, { x: minX, y: maxY }, { x: maxX, y: maxY }, { x: midX, y: minY }, { x: midX, y: maxY }, { x: minX, y: midY }, { x: maxX, y: midY }, { x: midX, y: midY } ];
      
      if (!axisLock) {
        let best = null;
        for (const p of pts) {
          const s = resolveSnap(p.x, p.y, geo, { minTier: SNAP_TIER.midpoint }); if (!s.snapped || s.axes !== 'xy') continue;
          if (!best || s.tier > best.s.tier || (s.tier === best.s.tier && s.dist < best.s.dist - 1e-9)) best = { s, p };
        }
        if (best) {
          res.dx = best.s.x - best.p.x; res.dy = best.s.y - best.p.y; res.snapped = true; res.kind = best.s.kind; res.point = { x: best.s.x, y: best.s.y };
          if (best.s.vLine) res.vLines.push(best.s.vLine); if (best.s.hLine) res.hLines.push(best.s.hLine);
          return res;
        }
      }
      
      const lineTol = SNAP_CFG.lineTol / zoom;
      const pickAxis = (vals, lines, key) => {
        let win = null;
        for (const val of vals) {
          for (const l of lines) { const d = Math.abs(l[key] - val); if (d > lineTol) continue; const t = SNAP_TIER[l.kind]; if (!win || t > win.tier || (t === win.tier && d < win.d - 1e-9)) win = { tier: t, d, off: l[key] - val, line: l }; }
          if (SNAP_CFG.grid) { const g = nearestGrid(val), d = Math.abs(g - val); if (d <= lineTol && (!win || SNAP_TIER.grid > win.tier)) { if (!win) win = { tier: SNAP_TIER.grid, d, off: g - val, line: null }; } }
        }
        return win;
      };
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const wx = axisLock === 'y' ? null : pickAxis(xs, geo.vLines, 'x'); const wy = axisLock === 'x' ? null : pickAxis(ys, geo.hLines, 'y');
      if (wx) { res.dx = wx.off; res.snapped = true; if (wx.line) res.vLines.push(wx.line); res.kind = res.kind || wx.line?.kind || 'grid'; }
      if (wy) { res.dy = wy.off; res.snapped = true; if (wy.line) res.hLines.push(wy.line); res.kind = res.kind || wy.line?.kind || 'grid'; }

    function resizeSnapDelta(direction, nX, nY, nW, nH, geo, noSnap = false) {
      const empty = { dx:0, dy:0, snapped:false, vLines:[], hLines:[], point:null, kind:null };
      if (noSnap || !SNAP_CFG.enabled) return empty;
      const hasE = direction.includes('e'), hasW = direction.includes('w'), hasS = direction.includes('s'), hasN = direction.includes('n');
      const px = hasE ? nX + nW : hasW ? nX : nX + nW/2; const py = hasS ? nY + nH : hasN ? nY : nY + nH/2;

        const s = resolveSnap(px, py, geo); if (!s.snapped) return empty;
        return { dx: s.x - px, dy: s.y - py, snapped: true, kind: s.kind, point: { x: s.x, y: s.y }, vLines: s.vLine ? [s.vLine] : [], hLines: s.hLine ? [s.hLine] : [] };
      }
      const axis = freeX ? 'x' : 'y'; const s = resolveSnap(px, py, geo, { axis }); if (!s.snapped) return empty;
      return { dx: freeX ? s.x - px : 0, dy: freeY ? s.y - py : 0, snapped: true, kind: s.kind, point: { x: s.x, y: s.y }, vLines: s.vLine ? [s.vLine] : [], hLines: s.hLine ? [s.hLine] : [] };

    function drawSnapFeedback(snap, opts = {}) {
      const layer = snapLayerEl(); layer.innerHTML = '';
      if (!snap || !snap.snapped || !SNAP_CFG.markers) return;
      const style = SNAP_STYLE[snap.kind] || SNAP_STYLE.grid;
      const drawLine = (kind, pos, from, to, infer) => {
        const el = document.createElement('div'); el.className = `${infer ? 'snap-infer-line' : 'snap-align-line'} ${kind}`;
        if (kind === 'vertical') { const a = Math.min(from, to), b = Math.max(from, to); Object.assign(el.style, { left:`${pos}px`, top:`${a}px`, height:`${b - a}px` }); }
        else { const a = Math.min(from, to), b = Math.max(from, to); Object.assign(el.style, { top:`${pos}px`, left:`${a}px`, width:`${b - a}px` }); }
        layer.appendChild(el);

      const maxH = importedMode ? importedViewport.height : (viewportMode === 'mobile' ? 812 : 720);
      const isInfer = snap.kind === 'intersection' || snap.kind === 'extension';
      (opts.vLines || (snap.vLine ? [snap.vLine] : [])).forEach(l => drawLine('vertical', l.x, Math.max(-2000, Math.min(l.y1, -0)), Math.min(maxH + 2000, Math.max(l.y2, maxH)), isInfer));
      (opts.hLines || (snap.hLine ? [snap.hLine] : [])).forEach(l => drawLine('horizontal', l.y, Math.max(-2000, Math.min(l.x1, -0)), Math.min(maxW + 2000, Math.max(l.x2, maxW)), isInfer));
      const marker = document.createElement('div'); marker.className = `snap-marker ${style.cls}`; marker.style.left = `${snap.x}px`; marker.style.top = `${snap.y}px`; layer.appendChild(marker);
      if (opts.tip !== false) {

    function drawRulers() {
      const rulerH = document.getElementById('ruler-h'); const rulerV = document.getElementById('ruler-v'); const scroll = document.querySelector('.canvas-scroll');
      if (!rulerH || !rulerV || !scroll || !artboard) return;
      const dpr = window.devicePixelRatio || 1;
      const rectH = rulerH.getBoundingClientRect(); const rectV = rulerV.getBoundingClientRect();
      if (rectH.width === 0 || rectV.height === 0) return;
      rulerH.width = rectH.width * dpr; rulerH.height = rectH.height * dpr;
      rulerV.width = rectV.width * dpr; rulerV.height = rectV.height * dpr;
      const ctxH = rulerH.getContext('2d'); const ctxV = rulerV.getContext('2d');
      ctxH.scale(dpr, dpr); ctxV.scale(dpr, dpr);
      const scrollRect = scroll.getBoundingClientRect(); const artboardRect = artboard.getBoundingClientRect();
      const originX = artboardRect.left - scrollRect.left; const originY = artboardRect.top - scrollRect.top;
      let logicalStep = 50; let minorStep = 10;
      if (zoom > 1.5) { logicalStep = 25; minorStep = 5; } if (zoom < 0.5) { logicalStep = 100; minorStep = 50; }
      
      ctxH.fillStyle = '#697586'; ctxH.strokeStyle = '#b7c0cf'; ctxH.font = '9px Inter, sans-serif'; ctxH.beginPath();
      let startLogicalX = Math.floor(-originX / zoom / minorStep) * minorStep;
      for (let logicalX = startLogicalX; (logicalX * zoom + originX) < rectH.width; logicalX += minorStep) {
        const x = Math.round(logicalX * zoom + originX); if (x < 0) continue;
        const isMajor = Math.abs(logicalX % logicalStep) < 0.1;
        ctxH.moveTo(x, isMajor ? 0 : 10); ctxH.lineTo(x, 18);
        if (isMajor) ctxH.fillText(Math.round(logicalX), x + 4, 8);
      }
      ctxH.stroke();
      
      ctxV.fillStyle = '#697586'; ctxV.strokeStyle = '#b7c0cf'; ctxV.font = '9px Inter, sans-serif'; ctxV.beginPath();
      let startLogicalY = Math.floor(-originY / zoom / minorStep) * minorStep;
      for (let logicalY = startLogicalY; (logicalY * zoom + originY) < rectV.height; logicalY += minorStep) {
        const y = Math.round(logicalY * zoom + originY); if (y < 0) continue;
        const isMajor = Math.abs(logicalY % logicalStep) < 0.1;
        ctxV.moveTo(isMajor ? 0 : 10, y); ctxV.lineTo(18, y);
        if (isMajor) { ctxV.save(); ctxV.translate(6, y + 4); ctxV.rotate(-Math.PI/2); ctxV.fillText(Math.round(logicalY), 0, 0); ctxV.restore(); }
      }
      ctxV.stroke();

    function startDemoDrag(event, forcedElement = null) {
      if (isPositionLocked || eraserMode || !editing || event.button !== 0) return;
      const target = forcedElement || event.target.closest('.demo-item'); if (!target) return;
      event.preventDefault(); event.stopPropagation();

      if (target.setPointerCapture) { try { target.setPointerCapture(event.pointerId); } catch(e) {} }
      
      const startX = event.screenX; const startY = event.screenY;
      const initialStates = items.filter(it => selectedIds.includes(it.id)).map(it => ({ item: it, x: it.x, y: it.y }));
      let moved = false; let dragAxis = null;
      invalidateSnapGeometry(); snapDragActive = true;

      function move(moveEvent) {
        let dx = (moveEvent.screenX - startX) / zoom; let dy = (moveEvent.screenY - startY) / zoom;

        if (!moved) { savePoint(); moved = true; }
        if (moveEvent.shiftKey) { if (!dragAxis) dragAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; if (dragAxis === 'x') dy = 0; else dx = 0; } else { dragAxis = null; }

        const minX = Math.min(...initialStates.map(s => s.x + dx)); const maxX = Math.max(...initialStates.map(s => s.x + s.item.w + dx));
        const minY = Math.min(...initialStates.map(s => s.y + dy)); const maxY = Math.max(...initialStates.map(s => s.y + s.item.h + dy));

        const noSnap = moveEvent.altKey;
        const snap = noSnap ? { dx:0, dy:0, snapped:false } : resolveBoxSnap({ minX, minY, maxX, maxY }, geo, { axisLock: dragAxis === 'x' ? 'x' : dragAxis === 'y' ? 'y' : null });
        const finalDx = dx + snap.dx, finalDy = dy + snap.dy;

        initialStates.forEach(s => {
            s.item.x = s.x + finalDx; s.item.y = s.y + finalDy;
            const el = artboard.querySelector(`[data-id="${s.item.id}"]`);
            if (el) { el.style.left = `${s.item.x}px`; el.style.top = `${s.item.y}px`; }
        });

          const pt = snap.point || { x: (minX + maxX)/2 + snap.dx, y: (minY + maxY)/2 + snap.dy };
          drawSnapFeedback({ snapped:true, kind: snap.kind || 'edge', x: pt.x, y: pt.y }, { vLines: snap.vLines, hLines: snap.hLines });

    }
    
    function startDemoResize(event, item, direction) {
      if (eraserMode || !editing || event.button !== 0) return;
      event.preventDefault(); event.stopPropagation();
      const target = event.currentTarget;
      if (target.setPointerCapture) { try { target.setPointerCapture(event.pointerId); } catch(e) {} }
      const startX = event.screenX; const startY = event.screenY;
      const original = { x: item.x, y: item.y, w: item.w, h: item.h };
      let moved = false;
      invalidateSnapGeometry(); snapDragActive = true;
      const geo = snapGeometry([item.id], true);

      function move(moveEvent) {
        const dx = (moveEvent.screenX - startX) / zoom; const dy = (moveEvent.screenY - startY) / zoom;
        if (!moved && Math.max(Math.abs(dx), Math.abs(dy)) < 4) return;
        if (!moved) { savePoint(); moved = true; }
        
        let nX = original.x, nY = original.y, nW = original.w, nH = original.h;
        let snap = null;

        if (isPositionLocked) {
          if (direction.includes('e')) nW = original.w + dx;
          if (direction.includes('w')) { nW = original.w - dx; nX = original.x + dx; }
          if (direction.includes('s')) nH = original.h + dy;
          if (direction.includes('n')) { nH = original.h - dy; nY = original.y + dy; }

          snap = resizeSnapDelta(direction, nX, nY, nW, nH, geo, moveEvent.altKey);
          
          let totalDx = dx + (snap.snapped && (direction.includes('e') || direction.includes('w')) ? snap.dx : 0);
          let totalDy = dy + (snap.snapped && (direction.includes('s') || direction.includes('n')) ? snap.dy : 0);

          if (direction.includes('e')) { nW = original.w + totalDx * 2; nX = original.x - totalDx; }
          if (direction.includes('w')) { nW = original.w - totalDx * 2; nX = original.x + totalDx; }
          if (direction.includes('s')) { nH = original.h + totalDy * 2; nY = original.y - totalDy; }
          if (direction.includes('n')) { nH = original.h - totalDy * 2; nY = original.y + totalDy; }

          if (nW < 20) { nW = 20; nX = original.x + original.w / 2 - 10; }
          if (nH < 20) { nH = 20; nY = original.y + original.h / 2 - 10; }
        } else {
          if (direction.includes('e')) nW = original.w + dx;
          if (direction.includes('w')) { nW = original.w - dx; nX = original.x + dx; }
          if (direction.includes('s')) nH = original.h + dy;
          if (direction.includes('n')) { nH = original.h - dy; nY = original.y + dy; }

          snap = resizeSnapDelta(direction, nX, nY, nW, nH, geo, moveEvent.altKey);
          if (snap.snapped) {
            if (direction.includes('e')) nW += snap.dx;
            if (direction.includes('w')) { nX += snap.dx; nW -= snap.dx; }
            if (direction.includes('s')) nH += snap.dy;
            if (direction.includes('n')) { nY += snap.dy; nH -= snap.dy; }
          }

          if (nW < 20) { if (direction.includes('w')) nX = original.x + original.w - 20; nW = 20; }
          if (nH < 20) { if (direction.includes('n')) nY = original.y + original.h - 20; nH = 20; }
        }
        
        item.x = nX; item.y = nY; item.w = nW; item.h = nH;

        const el = artboard.querySelector(`[data-id="${item.id}"]`);
        if (el) Object.assign(el.style, {left:`${item.x}px`, top:`${item.y}px`, width:`${item.w}px`, height:`${item.h}px`});

        if (snap && snap.snapped) {
          const pt = snap.point || { x: nX + (direction.includes('w') ? 0 : nW), y: nY + (direction.includes('n') ? 0 : nH) };
          drawSnapFeedback({ snapped:true, kind: snap.kind || 'edge', x: pt.x, y: pt.y }, { vLines: snap.vLines, hLines: snap.hLines });
        } else clearSnapFeedback();
      }
      
      function stop(upEvent) {
        if (target.releasePointerCapture) { try { target.releasePointerCapture(upEvent.pointerId); } catch(e) {} }
        target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', stop);
        snapDragActive = false; clearSnapFeedback(); invalidateSnapGeometry();
        if (moved) { renderDemo(); if(!isTyping) renderDemoInspector(); }
      }
      target.addEventListener('pointermove', move); target.addEventListener('pointerup', stop);
    }

    function startManualGuideDrag(event, kind, index = null, copyOrigin = null) {
      if (guideMode === 'hidden' || guideDrag) return;
      event.preventDefault(); event.stopPropagation();
      
      const evtDoc = (importedMode && importedFrame?.contentDocument) ? importedFrame.contentDocument : document;
      const rect = (evtDoc === document) ? artboard.getBoundingClientRect() : { left: 0, top: 0 };
      const startMouseX = event.clientX - rect.left;
      const startMouseY = event.clientY - rect.top;

      const list = importedMode ? importedManualGuides : manualGuides;
      
      if (index === null) {
        savePoint();
        list.push({ kind, position: copyOrigin, copied: true });
        index = list.length - 1;
        selectManualGuide(importedMode ? 'imported' : 'demo', index, { copied: true });
      }
      
      const originPos = list[index].position;
      const offset = (kind === 'vertical' ? startMouseX : startMouseY) / zoom - originPos;
      
      guideDrag = { kind, index, offset };
      document.body.style.cursor = kind === 'vertical' ? 'ew-resize' : 'ns-resize';
      let moved = false;
      invalidateSnapGeometry(); snapDragActive = true;
      const geoGuide = snapGeometry([], true);

      function move(moveEvent) {

             rawPos = kind === 'vertical' ? snapRes.x : snapRes.y;
          }
        }

        if (!moved) { savePoint(); moved = true; }
        list[guideDrag.index].position = rawPos;

        const layer = importedMode ? (importedFrame?.contentDocument) : document;
        if (layer) {
           const guides = layer.querySelectorAll('.manual-guide');
           if (guides[guideDrag.index]) {
               if (kind === 'vertical') guides[guideDrag.index].style.left = `${rawPos}px`;
               else guides[guideDrag.index].style.top = `${rawPos}px`;
           }
        }

        if (snapRes && snapRes.snapped) {
          drawSnapFeedback({ snapped:true, kind: snapRes.kind, x: snapRes.x, y: snapRes.y }, { vLines: snapRes.vLine ? [snapRes.vLine] : [], hLines: snapRes.hLine ? [snapRes.hLine] : [] });

    function alignSelected(kind) { 
      const selected = importedMode ? importedSelectedElements : selectedDemoItems(); 
      if (!selected.length || ((kind === 'distribute-x' || kind === 'distribute-y') && selected.length < 3)) return;
      savePoint(); 
      
      if (importedMode) {
        const rects = selected.map(el => ({ el, rect: el.getBoundingClientRect(), state: importedState.get(el) }));
        const canvasW = importedViewport.width; const canvasH = importedViewport.height;

        if (selected.length === 1) {
            const r = rects[0];
            if (kind === 'left') r.state.dx -= r.rect.left;
            else if (kind === 'right') r.state.dx += (canvasW - r.rect.right);
            else if (kind === 'top') r.state.dy -= r.rect.top;
            else if (kind === 'bottom') r.state.dy += (canvasH - r.rect.bottom);
            else if (kind === 'center-x') r.state.dx += (canvasW / 2 - (r.rect.left + r.rect.width / 2));
            else if (kind === 'center-y') r.state.dy += (canvasH / 2 - (r.rect.top + r.rect.height / 2));
        } else {
            if (kind === 'left') { const minX = Math.min(...rects.map(r => r.rect.left)); rects.forEach(r => r.state.dx += (minX - r.rect.left)); }
            else if (kind === 'right') { const maxX = Math.max(...rects.map(r => r.rect.right)); rects.forEach(r => r.state.dx += (maxX - r.rect.right)); }
            else if (kind === 'top') { const minY = Math.min(...rects.map(r => r.rect.top)); rects.forEach(r => r.state.dy += (minY - r.rect.top)); }
            else if (kind === 'bottom') { const maxY = Math.max(...rects.map(r => r.rect.bottom)); rects.forEach(r => r.state.dy += (maxY - r.rect.bottom)); }
            else if (kind === 'center-x') { const midX = (Math.min(...rects.map(r => r.rect.left)) + Math.max(...rects.map(r => r.rect.right))) / 2; rects.forEach(r => r.state.dx += (midX - (r.rect.left + r.rect.width/2))); }
            else if (kind === 'center-y') { const midY = (Math.min(...rects.map(r => r.rect.top)) + Math.max(...rects.map(r => r.rect.bottom))) / 2; rects.forEach(r => r.state.dy += (midY - (r.rect.top + r.rect.height/2))); }
            else if (kind === 'distribute-x' && rects.length >= 3) {
                const ordered = [...rects].sort((a, b) => a.rect.left - b.rect.left);
                const span = ordered.at(-1).rect.right - ordered[0].rect.left;
                const totalW = ordered.reduce((sum, r) => sum + r.rect.width, 0);
                const gap = (span - totalW) / (ordered.length - 1);
                let currentLeft = ordered[0].rect.left;
                ordered.forEach((r, i) => { if (i > 0) r.state.dx += (currentLeft - r.rect.left); currentLeft += r.rect.width + gap; });
            }
            else if (kind === 'distribute-y' && rects.length >= 3) {
                const ordered = [...rects].sort((a, b) => a.rect.top - b.rect.top);
                const span = ordered.at(-1).rect.bottom - ordered[0].rect.top;
                const totalH = ordered.reduce((sum, r) => sum + r.rect.height, 0);
                const gap = (span - totalH) / (ordered.length - 1);
                let currentTop = ordered[0].rect.top;
                ordered.forEach((r, i) => { if (i > 0) r.state.dy += (currentTop - r.rect.top); currentTop += r.rect.height + gap; });
            }
        }
        applyImportedState(); if (!isTyping) renderImportedInspector();
      } else {
        const maxWidth = viewportMode === 'mobile' ? 375 : 1280; const maxHeight = viewportMode === 'mobile' ? 812 : 720;
        if (selected.length === 1) { 
          const item = selected[0]; 
          if (kind === 'left') item.x = 0; if (kind === 'center-x') item.x = Math.round((maxWidth - item.w) / 2); if (kind === 'right') item.x = maxWidth - item.w; 
          if (kind === 'top') item.y = 0; if (kind === 'center-y') item.y = Math.round((maxHeight - item.h) / 2); if (kind === 'bottom') item.y = maxHeight - item.h; 
        } else { 
          const minX = Math.min(...selected.map(item => item.x)); const maxRight = Math.max(...selected.map(item => item.x + item.w)); 
          const minY = Math.min(...selected.map(item => item.y)); const maxBottom = Math.max(...selected.map(item => item.y + item.h)); 
          if (kind === 'left') selected.forEach(item => item.x = minX); if (kind === 'center-x') selected.forEach(item => item.x = Math.round((minX + maxRight - item.w) / 2)); if (kind === 'right') selected.forEach(item => item.x = maxRight - item.w); 
          if (kind === 'top') selected.forEach(item => item.y = minY); if (kind === 'center-y') selected.forEach(item => item.y = Math.round((minY + maxBottom - item.h) / 2)); if (kind === 'bottom') selected.forEach(item => item.y = maxBottom - item.h); 
          if (kind === 'distribute-x') { const ordered = [...selected].sort((a, b) => a.x - b.x); const span = ordered.at(-1).x + ordered.at(-1).w - ordered[0].x; const gap = (span - ordered.reduce((sum, item) => sum + item.w, 0)) / (ordered.length - 1); let position = ordered[0].x; ordered.forEach((item, index) => { if (index) item.x = Math.round(position); position = item.x + item.w + gap; }); } 
          if (kind === 'distribute-y') { const ordered = [...selected].sort((a, b) => a.y - b.y); const span = ordered.at(-1).y + ordered.at(-1).h - ordered[0].y; const gap = (span - ordered.reduce((sum, item) => sum + item.h, 0)) / (ordered.length - 1); let position = ordered[0].y; ordered.forEach((item, index) => { if (index) item.y = Math.round(position); position = item.y + item.h + gap; }); } 
        } 
        renderDemo(); 
      }
    }

      html += '<div class="section typography-panel"><h2 class="panel-title">🅰 文字與排版</h2>';
      if (textEditable) {
        html += '<div class="field full"><label>文字內容</label><textarea id="itext" rows="3">' + escapeHtml(state.textOverride ?? importedSelected.textContent) + '</textarea></div>';
        html += '<div class="form-grid" style="margin-top:6px;">';
        html += '<div class="field full"><label>字體 (Font)</label><select id="ifontFamily">' + fontOptions + '</select></div>';
        html += '<div class="field"><label>文字大小 (px)</label><input type="number" id="ifontSize" value="' + state.fontSize + '"></div>';
        html += '<div class="field"><label>文字顏色</label><div class="color-input"><input id="itextColor" type="color" value="' + state.textColor + '"></div></div>';
        html += '<div class="field full"><label class="checkbox-field"><input type="checkbox" id="itextShadow" ' + (state.textShadow ? 'checked' : '') + '> 開啟文字陰影</label>';
        if (state.textShadow) { html += '<div class="color-input" style="margin-top:4px"><input id="ishadowColor" type="color" value="' + state.shadowColor + '"></div>'; }
        html += '</div></div>';
      } else {
        html += '<p class="hint">呢個係容器元素，請直接點選入面嘅文字先可以修改。</p>';
      }
      html += '</div>';

      inspector.innerHTML = html;
    }

    function updateImportedText(event, commit = false) {
      if (!importedSelected || importedSelected.children.length > 0) return;
      isTyping = event && event.type === 'input';
      const state = importedState.get(importedSelected); 
      state.textOverride = document.querySelector('#itext')?.value ?? state.textOverride; 
      state.fontFamily = document.querySelector('#ifontFamily')?.value ?? state.fontFamily; 
      state.fontSize = Number(document.querySelector('#ifontSize')?.value ?? state.fontSize); 
      state.textColor = document.querySelector('#itextColor')?.value ?? state.textColor;
      state.textShadow = document.querySelector('#itextShadow')?.checked ?? state.textShadow; 
      state.shadowColor = document.querySelector('#ishadowColor')?.value ?? state.shadowColor;
      
      importedSelected.textContent = state.textOverride; 
      if (!state.textDirty) { savePoint(); state.textDirty = true; }
      importedDirty = true; applyImportedState();
      if (commit) { state.textDirty = false; }
    }

    function updateImported(event, commit = false) {
      if (!importedSelected) return;
      isTyping = event && event.type === 'input';
      const state = importedState.get(importedSelected); if (!state) return;
      
      const newW = Number(document.querySelector('#iw')?.value ?? state.width);
      const newH = Number(document.querySelector('#ih')?.value ?? state.height);
      if (newW !== state.width || newH !== state.height) state.widthModified = true;

      state.dx = clamp(Number(document.querySelector('#ix')?.value ?? state.dx), -5000, 5000); 
      state.dy = clamp(Number(document.querySelector('#iy')?.value ?? state.dy), -5000, 5000);
      state.width = clamp(newW, 1, 10000); 
      state.height = clamp(newH, 1, 10000);
      state.borderRadius = Number(document.querySelector('#iborderRadius')?.value ?? state.borderRadius);
      state.borderWidth = Number(document.querySelector('#iborderWidth')?.value ?? state.borderWidth);
      state.borderStyle = document.querySelector('#iborderStyle')?.value ?? state.borderStyle;
      state.borderColor = document.querySelector('#iborderColor')?.value ?? state.borderColor;
      state.colorOverride = document.querySelector('#icolor')?.value ?? state.colorOverride;
      state.gradient = document.querySelector('#igradient')?.checked ?? state.gradient;
      state.gStart = document.querySelector('#igStart')?.value ?? state.gStart;
      state.gEnd = document.querySelector('#igEnd')?.value ?? state.gEnd;
      state.gAngle = Number(document.querySelector('#igAngle')?.value ?? state.gAngle);
      state.boxShadow = document.querySelector('#ishadow')?.checked ?? state.boxShadow;
      state.sX = Number(document.querySelector('#isX')?.value ?? state.sX);
      state.sY = Number(document.querySelector('#isY')?.value ?? state.sY);
      state.sBlur = Number(document.querySelector('#isBlur')?.value ?? state.sBlur);
      state.sColor = document.querySelector('#isColor')?.value ?? state.sColor;

      if (!state.fieldDirty) { savePoint(); state.fieldDirty = true; }
      importedDirty = true; applyImportedState();
      
      if (commit) { state.fieldDirty = false; }
    }

    inspector.addEventListener('input', e => {
       if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') {
          if (importedMode) {
              if (e.target.id.startsWith('itext') || e.target.id.startsWith('ifont') || e.target.id.startsWith('ishadowC')) { updateImportedText(e, false); } else { updateImported(e, false); }
          } else { updateDemo(e, false); }
       }
    });
    
    inspector.addEventListener('change', e => {
       if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') {
          if (importedMode) {
              if (e.target.id.startsWith('itext') || e.target.id.startsWith('ifont') || e.target.id.startsWith('ishadowC')) { updateImportedText(e, true); } else { updateImported(e, true); }
          } else { updateDemo(e, true); }
          if (!isTyping) { importedMode ? renderImportedInspector() : renderDemoInspector(); }
       }
    });
    
    inspector.addEventListener('click', e => {
        const btn = e.target.closest('[data-align]');
        if (btn) alignSelected(btn.dataset.align);
        const listBtn = e.target.closest('.deep-inspect-item');
        if (listBtn) {
            const idx = parseInt(listBtn.dataset.idx); 
            if (importedMode) { if (importedSelectedElements[idx]) { selectImported(importedSelectedElements[idx], false); } } else { const id = listBtn.dataset.id; if (id) { setDemoSelection([id]); renderDemo(); renderDemoInspector(); } }
        }
    });

    function snapshot() { return JSON.stringify({ items: items.map(i => ({...i})), manualGuides, hiddenDemoGuideKeys, demoGuideTargets, importedManualGuides, hiddenImportedGuideKeys, importedGuideTargets: importedGuideTargets.map(element => importedLayers.findIndex(item => item.element === element)).filter(index => index >= 0), activeTheme, importedMode, importedSourceHtml, importedHtml, importedDirty, editing, zoom, guideMode, eraserMode, viewportMode, isPositionLocked }); }
    function restoreSnapshot(value) { 
        const state = JSON.parse(value); 
        items = state.items || [];
        manualGuides = state.manualGuides || [];
        hiddenDemoGuideKeys = state.hiddenDemoGuideKeys || [];
        demoGuideTargets = state.demoGuideTargets || [];
        importedManualGuides = state.importedManualGuides || [];
        hiddenImportedGuideKeys = state.hiddenImportedGuideKeys || [];
        isPositionLocked = state.isPositionLocked || false;
        
        if (importedMode && state.importedHtml !== importedHtml) {
            importedHtml = state.importedHtml;
            if (importedFrame) {
                importedFrame.srcdoc = importedHtml;
            }
        }
        
        updateToolButtons(); render(); drawRulers(); 
    }
    function updateHistoryButtons() { document.querySelector('#undo').disabled = history.length === 0; document.querySelector('#redo').disabled = future.length === 0; }
    function savePoint() { history.push(snapshot()); if (history.length > 40) history.shift(); future = []; updateHistoryButtons(); }
    function undo() { if (!history.length) return; future.push(snapshot()); restoreSnapshot(history.pop()); updateHistoryButtons(); }
    function redo() { if (!future.length) return; history.push(snapshot()); restoreSnapshot(future.pop()); updateHistoryButtons(); }
    
    function performQuickSave() {
        if (!importedMode || !importedFrame || !importedFrame.contentDocument) {
            setStatus('暫存功能主要適用於匯入嘅網頁檔案。');
            return;
        }
        const doc = importedFrame.contentDocument;
        const htmlClone = doc.documentElement.cloneNode(true);

        htmlClone.querySelectorAll('.ui-editor-selected').forEach(el => el.classList.remove('ui-editor-selected'));
        const overlay = htmlClone.querySelector('#ui-editor-overlay'); if (overlay) overlay.remove();
        htmlClone.querySelectorAll('.guide-layer, .manual-guide').forEach(el => el.remove());
        const styleTag = htmlClone.querySelector('#ui-editor-style'); if (styleTag) styleTag.remove();
        htmlClone.classList.remove('position-locked', 'eraser-mode');

        importedHtml = '<!doctype html>\n' + htmlClone.outerHTML;
        importedDirty = false;
        
        const btn = document.querySelector('#quick-save');
        if (btn) {
            const oldBg = btn.style.background;
            btn.style.background = '#a8f0c6';
            setTimeout(() => { btn.style.background = oldBg; }, 300);
        }
        
        savePoint();
        setStatus('💾 已成功暫存！你而家所見嘅修改已經寫入內部記憶體。');
    }

    document.querySelector('#export').addEventListener('click', () => {
        if (!importedMode) { setStatus('請先匯入網頁檔案，再進行匯出。'); return; }
        performQuickSave(); // 匯出前強制幫你暫存一次，確保攞到最新畫面
        
        const blob = new Blob([importedHtml], {type: 'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); 
        a.href = url; 
        a.download = 'visionflow_export.html'; 
        a.click();
        URL.revokeObjectURL(url);
        
        setStatus('✅ HTML 檔案已成功匯出到你嘅電腦！');
    });

    document.querySelector('#quick-save').addEventListener('click', performQuickSave);

    function fitView() { if (!importedMode || !importedFrame) { zoom = 1; zoomLabel.textContent = '100%'; renderDemo(); return; } updateImportedViewport(); const area = document.querySelector('.canvas-scroll'); const ratio = Math.min((area.clientWidth - 32) / importedViewport.width, (area.clientHeight - 32) / importedViewport.height, 1); zoom = clamp(Math.round(ratio * 100) / 100, .1, 1); zoomLabel.textContent = `${Math.round(zoom * 100)}%`; updateImportedViewport(); drawRulers(); }

    function fileAsDataUrl(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result)); reader.onerror = () => reject(reader.error); reader.readAsDataURL(file); }); }
    async function loadSelectedFiles(files) { const htmlFile = files.find(file => /\.html?$/i.test(file.name)); if (!htmlFile) return; try { const reader = new FileReader(); reader.onload = () => { savePoint(); importedMode = true; importedSourceHtml = String(reader.result); importedHtml = importedSourceHtml; importedDirty = false; importedFrame = null; editing = true; isIframeLoaded = false; updateToolButtons(); renderImportedState(); }; reader.readAsText(htmlFile); } catch (error) { setStatus('讀取檔案失敗。'); } }

    async function toggleFullscreen() {
      if (document.fullscreenElement) { await document.exitFullscreen?.(); return; }
      try { await document.documentElement.requestFullscreen(); } catch (error) {
        app.classList.toggle('focus-mode'); const isFocus = app.classList.contains('focus-mode');
        if (isFocus) { document.querySelector('.workspace').classList.add('left-closed', 'right-closed'); }
        setTimeout(() => { fitView(); drawRulers(); }, 50);
      }
    }

    document.querySelector('#toggle-left').addEventListener('click', () => { document.querySelector('.workspace').classList.toggle('left-closed'); setTimeout(() => { fitView(); drawRulers(); }, 180); });
    document.querySelector('#toggle-right').addEventListener('click', () => { document.querySelector('.workspace').classList.toggle('right-closed'); setTimeout(() => { fitView(); drawRulers(); }, 180); });
    
    document.querySelector('#close-sidebar-btn').addEventListener('click', () => { document.querySelector('.workspace').classList.add('left-closed'); setTimeout(() => { fitView(); drawRulers(); }, 180); });
    document.querySelector('#close-inspector-btn').addEventListener('click', () => { document.querySelector('.workspace').classList.add('right-closed'); setTimeout(() => { fitView(); drawRulers(); }, 180); });

    document.querySelector('#edit-mode').addEventListener('click', () => { editing = !editing; updateToolButtons(); if (importedMode) renderImportedState(); else renderDemo(); });
    document.querySelector('#toggle-viewport').addEventListener('click', () => { viewportMode = viewportMode === 'desktop' ? 'mobile' : 'desktop'; if (importedMode) updateImportedViewport(); else renderDemo(); fitView(); });
    document.querySelector('#undo').addEventListener('click', undo); document.querySelector('#redo').addEventListener('click', redo);
    document.querySelector('#reset').addEventListener('click', () => {
      savePoint(); items = structuredClone(initialItems); importedMode = false; selectedId = null; selectedIds = []; editing = false; zoom = 1; zoomLabel.textContent = '100%';
      manualGuides = []; importedManualGuides = []; demoGuideTargets = []; importedGuideTargets = []; hiddenDemoGuideKeys = []; hiddenImportedGuideKeys = [];
      eraserMode = false; panMode = false; measureMode = false; measureState = 'idle'; isPositionLocked = false; isIframeLoaded = false; updateToolButtons(); viewportMode = 'desktop'; applyTheme(themes[0]); renderDemo();
    });
    
    document.querySelector('#zoom-in').addEventListener('click', () => { zoom = clamp(zoom + .1, .1, 1.5); zoomLabel.textContent = `${Math.round(zoom * 100)}%`; invalidateSnapGeometry(); clearSnapFeedback(); snapLayerEl(); if (importedMode) updateImportedViewport(); else renderDemo(); drawRulers(); });
    document.querySelector('#zoom-out').addEventListener('click', () => { zoom = clamp(zoom - .1, .1, 1.5); zoomLabel.textContent = `${Math.round(zoom * 100)}%`; invalidateSnapGeometry(); clearSnapFeedback(); snapLayerEl(); if (importedMode) updateImportedViewport(); else renderDemo(); drawRulers(); });
    
    document.querySelector('#snap-toggle').addEventListener('click', () => {
      SNAP_CFG.enabled = !SNAP_CFG.enabled;
      if (!SNAP_CFG.enabled) clearSnapFeedback();
      updateToolButtons();
      setStatus(SNAP_CFG.enabled ? '智能鎖點已開啟：交點／端點／中點會自動吸附。拖曳時按住 Alt 可暫時解除。' : '智能鎖點已關閉。');
    });

    document.querySelector('#snap-grid-toggle').addEventListener('click', () => {
      SNAP_CFG.grid = !SNAP_CFG.grid;
      invalidateSnapGeometry(); updateToolButtons();
      setStatus(SNAP_CFG.grid ? '網格吸附已開啟（10px）。' : '網格吸附已關閉：只吸附物件與參考線。');
    });

    document.querySelector('#snap-hover').addEventListener('click', () => {
      activeSnapHover = !activeSnapHover;
      if (!activeSnapHover) clearSnapFeedback();
      updateToolButtons();
      setStatus(activeSnapHover ? '鎖點預覽已開啟：移動滑鼠即可睇到交點（洋紅 ✕）、端點（綠方）、中點（青菱）、線上（紅圈）。' : '鎖點預覽已關閉。');
    });

    canvasScroll.addEventListener('pointermove', e => {
      if (snapDragActive) return;
      if (!activeSnapHover || measureMode || guideDrag || isPanning) return;
      const rect = artboard.getBoundingClientRect();
      const lx = (e.clientX - rect.left) / zoom, ly = (e.clientY - rect.top) / zoom;
      const geo = snapGeometry([], true);
      const s = e.altKey ? { snapped:false } : resolveSnap(lx, ly, geo);
      if (s.snapped) drawSnapFeedback(s, { vLines: s.vLine ? [s.vLine] : [], hLines: s.hLine ? [s.hLine] : [] });
      else clearSnapFeedback();
    });
    canvasScroll.addEventListener('pointerleave', () => { if (activeSnapHover) clearSnapFeedback(); });

    document.querySelector('#toggle-guides').addEventListener('click', cycleGuideMode);
    document.querySelector('#guide-eraser').addEventListener('click', toggleGuideEraser);
    document.querySelector('#add-vertical-guide').addEventListener('click', () => addManualGuide('vertical'));
    document.querySelector('#add-horizontal-guide').addEventListener('click', () => addManualGuide('horizontal'));

    document.querySelector('#file-input').addEventListener('change', event => loadSelectedFiles([...event.target.files]));
    document.querySelector('#folder-input').addEventListener('change', event => loadSelectedFiles([...event.target.files]));
    
    document.querySelector('#focus-mode').addEventListener('click', toggleFullscreen); document.querySelector('#focus-exit').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => { const full = Boolean(document.fullscreenElement); app.classList.toggle('focus-mode', full); if (full) { document.querySelector('.workspace').classList.add('left-closed', 'right-closed'); } setTimeout(() => { fitView(); drawRulers(); }, 50); });
    
    function initResizers() {
      const workspace = document.querySelector('.workspace');
      document.querySelector('#sidebar-resizer').addEventListener('pointerdown', event => {
        if (event.button !== 0) return; event.preventDefault(); workspace.classList.add('resizing'); const startX = event.clientX; const startWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'));
        const move = e => document.documentElement.style.setProperty('--sidebar-width', `${clamp(startWidth + (e.clientX - startX), 90, window.innerWidth / 2)}px`);
        const stop = () => { workspace.classList.remove('resizing'); document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', stop); drawRulers(); };
        document.addEventListener('pointermove', move); document.addEventListener('pointerup', stop);
      });
      document.querySelector('#inspector-resizer').addEventListener('pointerdown', event => {
        if (event.button !== 0) return; event.preventDefault(); workspace.classList.add('resizing'); const startX = event.clientX; const startWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--inspector-width'));
        const move = e => document.documentElement.style.setProperty('--inspector-width', `${clamp(startWidth - (e.clientX - startX), 150, window.innerWidth / 2)}px`);
        const stop = () => { workspace.classList.remove('resizing'); document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', stop); drawRulers(); };
        document.addEventListener('pointermove', move); document.addEventListener('pointerup', stop);
      });
    }

    function render() { if (!importedMode) applyTheme(themes.find(theme => theme.id === activeTheme) || themes[0]); renderThemes(); if (importedMode) renderImportedState(); else renderDemo(); updateHistoryButtons(); drawRulers(); }
    
    document.addEventListener('keydown', e => {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k === 'g') { e.preventDefault(); toggleGroup(); return; }
      if (e.ctrlKey || e.metaKey) return;
      if (k === 's') { e.preventDefault(); document.querySelector('#snap-toggle').click(); }
      else if (k === 'i') { e.preventDefault(); document.querySelector('#snap-hover').click(); }
      else if (k === 'g') { e.preventDefault(); document.querySelector('#snap-grid-toggle').click(); }
    });

    window.addEventListener('resize', invalidateSnapGeometry);
    canvasScroll.addEventListener('scroll', () => { if (activeSnapHover) clearSnapFeedback(); });

    initResizers(); applyTheme(themes[0]); renderThemes(); renderDemo(); updateHistoryButtons(); drawRulers();
    updateToolButtons();
    setStatus('就緒。');
  </script>
</body>
</html>
